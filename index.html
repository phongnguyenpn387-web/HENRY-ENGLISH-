<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Henry English Class – Grade 1</title>

<style>
:root{
  --navy:#000055;
  --orange:#FF6600;
  --green:#16a34a;
  --red:#dc2626;
  --bg:#f4f7fb;
  --ink:#182033;
  --card:#fff;
  --muted:#667085;
  --line:#d9deea
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:var(--bg);
  color:var(--ink)
}

button{
  font:inherit;
  cursor:pointer;
  border:0
}

.screen{
  display:none;
  min-height:100vh
}

.active{
  display:flex
}

.welcome{
  align-items:center;
  justify-content:center;
  padding:24px;
  background:var(--navy)
}

.welcome .box{
  width:min(900px,100%);
  text-align:center;
  background:transparent;
  border-radius:28px;
  padding:48px 28px;
  box-shadow:none
}

.logo{
  font-size:clamp(28px,6vw,54px);
  font-weight:900;
  color:var(--orange);
  margin:0 0 12px;
  text-shadow:0 2px 8px #0008
}

.sub{
  font-size:18px;
  color:#fff;
  margin-bottom:30px
}

.app{
  width:100%;
  flex-direction:column
}

header{
  background:var(--navy);
  color:white;
  padding:14px 22px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  position:sticky;
  top:0;
  z-index:5
}

header strong{
  font-size:18px
}

main{
  width:min(1100px,100%);
  margin:0 auto;
  padding:24px 16px 45px;
  flex:1
}

.title{
  text-align:center;
  color:var(--navy);
  font-size:clamp(25px,4vw,38px);
  margin:10px 0 25px
}

.panel{
  background:var(--card);
  border-radius:22px;
  padding:24px;
  box-shadow:0 10px 30px #0000000c;
  border:1px solid var(--line)
}

.cards{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px
}

.menu{
  background:white;
  border:2px solid var(--line);
  border-radius:22px;
  padding:25px 18px;
  min-height:190px;
  transition:.18s
}

.menu:hover{
  transform:translateY(-3px);
  border-color:var(--orange)
}

.menu h2{
  margin:10px 0 6px;
  color:var(--navy)
}

.menu p{
  margin:0;
  color:var(--muted)
}

.ico{
  font-size:48px
}

.primary,
.control,
.back,
.unit,
.opt{
  border-radius:14px;
  padding:12px 18px;
  font-weight:800
}

.primary{
  background:var(--navy);
  color:#fff
}

.primary.orange{
  background:var(--orange)
}

.back{
  background:#fff;
  color:var(--navy);
  border:1px solid var(--line);
  margin-bottom:15px
}

.row{
  display:flex;
  align-items:center;
  gap:12px;
  flex-wrap:wrap
}

.muted{
  color:var(--muted)
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin:18px 0
}

.unit{
  background:#fff;
  border:2px solid var(--line);
  color:var(--navy);
  min-height:72px
}

.unit small{
  display:block;
  color:var(--muted);
  font-weight:600;
  margin-top:5px;
  font-size:11px
}

.unit.sel{
  background:#fff3ea;
  border-color:var(--orange)
}

.wordCard,
.speakWrap{
  text-align:center;
  max-width:780px;
  margin:auto
}

.bar{
  height:9px;
  background:#e8ebf2;
  border-radius:99px;
  overflow:hidden;
  margin:14px 0 22px
}

.bar i{
  display:block;
  height:100%;
  background:var(--orange)
}

.image{
  height:260px;
  border:2px dashed #cfd5e2;
  border-radius:22px;
  background:#fafbfe;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  margin:15px auto;
  max-width:560px
}

.pic{
  font-size:100px;
  line-height:1
}

.label{
  font-size:11px;
  color:#98a2b3;
  margin-top:12px;
  text-transform:uppercase;
  letter-spacing:.5px
}

.word{
  font-size:42px;
  font-weight:900;
  color:var(--navy);
  margin-top:12px
}

.ipa{
  font-size:22px;
  color:var(--orange);
  margin:6px
}

.meaning{
  font-size:20px;
  color:var(--muted)
}

.speaker{
  width:58px;
  height:58px;
  border-radius:50%;
  background:var(--navy);
  color:white;
  font-size:26px;
  margin:16px 0
}

.speaker.play{
  transform:scale(1.08)
}

.memoryIntro{
  text-align:center;
  margin-bottom:20px
}

.modeRules{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  margin-top:18px
}

.rule{
  border:1px solid var(--line);
  border-radius:16px;
  padding:16px;
  background:#fbfcff
}

.rule b{
  display:block;
  color:var(--navy);
  margin-bottom:6px
}

.questionNo{
  font-weight:900;
  color:var(--orange);
  text-transform:uppercase;
  letter-spacing:.4px
}

.timer{
  font-size:42px;
  font-weight:900;
  color:var(--orange);
  height:58px;
  margin:10px
}

.qtext{
  font-size:30px;
  font-weight:900;
  color:var(--navy);
  margin:18px 0
}

.answer{
  font-size:26px;
  font-weight:900;
  color:var(--green);
  margin:18px
}

.hidden{
  visibility:hidden;
  opacity:0
}

.controls{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:9px;
  margin-top:24px
}

.control{
  background:white;
  border:1px solid var(--line);
  color:var(--navy)
}

.control:disabled{
  opacity:.45;
  cursor:not-allowed
}

.opts{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
  margin-top:20px
}

.opt{
  background:#fff;
  border:2px solid var(--line);
  min-height:100px;
  color:var(--navy);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  flex-direction:column
}

.opt:hover:not(:disabled){
  border-color:var(--orange)
}

.opt.correct{
  border-color:var(--green);
  background:#ecfdf3;
  color:var(--green)
}

.opt.wrong{
  border-color:var(--red);
  background:#fef2f2;
  color:var(--red)
}

.opt .pic{
  font-size:58px
}

.result{
  font-weight:900;
  font-size:20px;
  margin-top:14px;
  min-height:28px
}

.finish{
  max-width:650px;
  margin:70px auto;
  text-align:center
}

.finish h1{
  color:var(--navy)
}

.memoryImageOnly .label{
  display:none
}

.memoryImageOnly .image{
  margin-bottom:20px
}

.memoryChoices .opt{
  min-height:120px
}

.memoryChoices .opt .pic{
  font-size:65px
}

.memoryWordChoices .opt{
  min-height:85px;
  font-size:22px
}

@media(max-width:800px){
  .cards,
  .modeRules{
    grid-template-columns:1fr
  }

  .grid{
    grid-template-columns:repeat(2,1fr)
  }

  .opts{
    grid-template-columns:1fr
  }

  .word{
    font-size:34px
  }

  .qtext{
    font-size:24px
  }

  .image{
    height:220px
  }
}

.logo span{
  display:block;
  white-space:nowrap
}

.welcome .logo{
  width:100%;
  max-width:900px;
  margin:0 auto 24px;
  text-align:center;
  font-size:clamp(38px,5vw,68px);
  line-height:1.08;
  font-weight:900;
  letter-spacing:1px;
  text-shadow:
    0 4px 0 rgba(0,0,0,.12),
    0 0 18px rgba(255,255,255,.14)
}

.welcome .logo span{
  display:block;
  width:100%;
  white-space:nowrap;
  text-align:center
}

.welcome .logo span:first-child{
  font-size:.72em;
  margin-bottom:10px;
  color:#fff
}

.welcome .logo span:last-child{
  font-size:1em;
  color:#FF6600
}
</style>
</head>

<body>

<section id="welcome" class="screen active welcome">

    <div class="sub">
      GLOBAL SUCCESS 1 • ENGLISH LEARNING SYSTEM

<main id="main"></main>

</section>

function language(){

  $('welcome').classList.remove('active');

  main.innerHTML=`

  lang=x;
  home();
}

}

  speak(q.answer,.72);

  if(speakingIndex>0){

    showSpeak();

/* =========================
   WELCOME MUSIC
========================= */

let welcomeAudioCtx=null;
let welcomeMusicTimer=null;


function startWelcome(){

  playWelcomeMusic();
  language();

}


function playWelcomeMusic(){

  try{

    if(!welcomeAudioCtx){

      welcomeAudioCtx=
        new (window.AudioContext||
             window.webkitAudioContext)();

    }

    if(welcomeAudioCtx.state==='suspended'){
      welcomeAudioCtx.resume();
    }

    if(welcomeMusicTimer)return;

    const notes=[
      523.25,
      659.25,
      783.99,
      659.25,
      587.33,
      698.46,
      880,
      698.46
    ];

    let i=0;

    const play=()=>{

      if(!welcomeAudioCtx)return;

      const o=
        welcomeAudioCtx.createOscillator();

      const g=
        welcomeAudioCtx.createGain();

      o.type='triangle';

      o.frequency.value=
        notes[i++%notes.length];

      g.gain.setValueAtTime(
        .0001,
        welcomeAudioCtx.currentTime
      );

      g.gain.exponentialRampToValueAtTime(
        .045,
        welcomeAudioCtx.currentTime+.02
      );

      g.gain.exponentialRampToValueAtTime(
        .0001,
        welcomeAudioCtx.currentTime+.22
      );

      o.connect(g)
       .connect(welcomeAudioCtx.destination);

      o.start();

      o.stop(
        welcomeAudioCtx.currentTime+.24
      );
    };

    play();

    welcomeMusicTimer=
      setInterval(play,280);

  }catch(e){}
}


function stopWelcomeMusic(){

  if(welcomeMusicTimer){

    clearInterval(welcomeMusicTimer);
    welcomeMusicTimer=null;

  }

  if(welcomeAudioCtx){

    try{
      welcomeAudioCtx.close();
    }catch(e){}

    welcomeAudioCtx=null;
  }
}


setTimeout(()=>{

  if($('welcome')?.classList.contains('active')){
    playWelcomeMusic();
  }

},300);


/* =========================
   UTILITIES
========================= */

function clearAll(){

  if(timer){

    clearInterval(timer);
    timer=null;

  }

  if(delay){

    clearTimeout(delay);
    delay=null;

  }

  if('speechSynthesis' in window){

    speechSynthesis.cancel();

  }
}


function shuffle(a){

  for(
    let i=a.length-1;
    i>0;
    i--
  ){

    let j=
      Math.floor(
        Math.random()*(i+1)
      );

    [a[i],a[j]]=
      [a[j],a[i]];

  }

  return a;
}


/*
  Tạo 3 lựa chọn:
  - đáp án đúng
  - 2 đáp án sai
*/

function makeChoices(x,n){

  let pool=
    list.filter(
      a=>a.word!==x.word
    );

  shuffle(pool);

  return shuffle([
    x,
    ...pool.slice(0,n)
  ]);
}


function speak(text,rate=.75){

  if(!('speechSynthesis' in window))return;

  speechSynthesis.cancel();

  let u=
    new SpeechSynthesisUtterance(text);

  u.lang='en-GB';
  u.rate=rate;
  u.pitch=1;

  speechSynthesis.speak(u);
}


function icon(x){

  let k=
    String(x)
      .toLowerCase()
      .trim();

  if(IMG[k])return IMG[k];

  for(let z in IMG){

    if(k.includes(z))
      return IMG[z];

  }

  return '🖼️';
}


function esc(x){

  return String(x).replace(
    /[&<>"']/g,
    m=>({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    }[m])
  );
}


function attr(x){

  return esc(x)
    .replace(/`/g,'&#96;');
}

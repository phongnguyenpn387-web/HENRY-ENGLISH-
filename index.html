<!doctype html>
<html lang="vi">
<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
>

<meta
  name="theme-color"
  content="#000055"
>

<title>Henry English Class – Grade 1</title>


<style>

/* =========================================================
   RESET + RESPONSIVE FOUNDATION
========================================================= */

html{
  width:100%;
  min-width:0;
  overflow-x:hidden;
}

body{
  width:100%;
  min-width:0;
  max-width:100%;
  margin:0;
  padding:0;
  overflow-x:hidden;
}

*{
  box-sizing:border-box;
  max-width:100%;
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}


/* =========================================================
   VARIABLES
========================================================= */

:root{

  --navy:#000055;
  --orange:#ff6600;
  --green:#16a34a;
  --red:#dc2626;

  --bg:#f4f7fb;
  --ink:#182033;
  --card:#ffffff;
  --muted:#667085;
  --line:#d9deea;

}


/* =========================================================
   BODY
========================================================= */

body{

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background:var(--bg);
  color:var(--ink);

}


/* =========================================================
   SCREEN
========================================================= */

.screen{
  display:none;
  width:100%;
  min-height:100vh;
  min-height:100dvh;
}

.screen.active{
  display:flex;
}


/* =========================================================
   WELCOME SCREEN
========================================================= */

.welcome{

  width:100%;

  min-height:100vh;
  min-height:100dvh;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:
    max(24px, env(safe-area-inset-top))
    max(18px, env(safe-area-inset-right))
    max(24px, env(safe-area-inset-bottom))
    max(18px, env(safe-area-inset-left));

  background:var(--navy);

  overflow:hidden;

}


.welcome .box{

  width:min(920px, 100%);

  max-width:100%;

  text-align:center;

  padding:
    clamp(30px, 6vw, 65px)
    clamp(16px, 5vw, 55px);

  margin:auto;

  overflow:hidden;

}


/* =========================================================
   WELCOME TITLE
========================================================= */

.welcome .logo{

  width:100%;
  max-width:100%;

  margin:0 auto;

  color:white;

  font-size:
    clamp(34px, 6vw, 68px);

  line-height:1.08;

  font-weight:900;

  letter-spacing:
    clamp(.2px, .15vw, 1.2px);

  text-align:center;

  text-shadow:
    0 4px 0 rgba(0,0,0,.12),
    0 0 18px rgba(255,255,255,.14);

}


.welcome .logo .welcome-small{

  display:block;

  width:100%;

  color:#fff;

  font-size:
    clamp(25px, 4vw, 48px);

  margin-bottom:
    clamp(8px, 1.5vw, 14px);

}


.welcome .logo .welcome-main{

  display:block;

  width:100%;

  color:var(--orange);

  font-size:
    clamp(34px, 6vw, 68px);

}


/*
  Desktop:
  HENRY ENGLISH CLASS stays on one line
  when there is enough room.
*/

.welcome-main .mobile-break{
  display:none;
}


/* =========================================================
   WELCOME SUBTITLE
========================================================= */

.welcome .sub{

  width:100%;
  max-width:760px;

  margin:
    clamp(22px, 4vw, 34px)
    auto
    clamp(22px, 4vw, 34px);

  color:#fff;

  font-size:
    clamp(16px, 2.5vw, 25px);

  line-height:1.35;

  text-align:center;

}


/* =========================================================
   WELCOME MUSIC TEXT
========================================================= */

.welcome-sound{

  color:#fff;

  font-size:
    clamp(14px, 2vw, 19px);

  margin:
    0 auto
    clamp(24px, 4vw, 35px);

}


/* =========================================================
   APP
========================================================= */

.app{

  width:100%;

  min-height:100vh;
  min-height:100dvh;

  flex-direction:column;

}


/* =========================================================
   HEADER
========================================================= */

header{

  width:100%;

  background:var(--navy);
  color:white;

  padding:
    13px
    max(16px, env(safe-area-inset-right))
    13px
    max(16px, env(safe-area-inset-left));

  display:flex;

  align-items:center;
  justify-content:space-between;

  gap:12px;

  position:sticky;
  top:0;

  z-index:50;

}


header strong{

  min-width:0;

  font-size:
    clamp(15px, 2vw, 20px);

  line-height:1.2;

}


#langBadge{

  flex:none;

  font-size:12px;

  font-weight:800;

  border:1px solid rgba(255,255,255,.35);

  border-radius:999px;

  padding:5px 9px;

}


/* =========================================================
   MAIN
========================================================= */

main{

  width:100%;

  max-width:1120px;

  margin:0 auto;

  padding:
    clamp(16px, 3vw, 28px)
    clamp(14px, 3vw, 22px)
    50px;

  flex:1;

  min-width:0;

}


/* =========================================================
   TITLE
========================================================= */

.title{

  width:100%;

  text-align:center;

  color:var(--navy);

  font-size:
    clamp(24px, 4vw, 40px);

  line-height:1.15;

  margin:
    8px auto
    clamp(20px, 4vw, 30px);

}


/* =========================================================
   PANEL
========================================================= */

.panel{

  width:100%;

  background:var(--card);

  border-radius:
    clamp(16px, 3vw, 24px);

  padding:
    clamp(16px, 4vw, 28px);

  box-shadow:
    0 10px 30px rgba(0,0,0,.06);

  border:1px solid var(--line);

  min-width:0;

}


/* =========================================================
   CARDS
========================================================= */

.cards{

  display:grid;

  grid-template-columns:
    repeat(3, minmax(0,1fr));

  gap:
    clamp(12px, 2vw, 20px);

}


.menu{

  width:100%;

  min-width:0;

  background:#fff;

  border:2px solid var(--line);

  border-radius:
    clamp(16px, 3vw, 23px);

  padding:
    clamp(18px, 3vw, 28px)
    clamp(14px, 2vw, 20px);

  min-height:
    clamp(160px, 22vw, 195px);

  transition:.18s;

  overflow:hidden;

}


.menu:hover{

  transform:translateY(-3px);

  border-color:var(--orange);

}


.menu h2{

  margin:
    10px 0 6px;

  color:var(--navy);

  font-size:
    clamp(18px, 2.5vw, 25px);

  line-height:1.2;

}


.menu p{

  margin:0;

  color:var(--muted);

  font-size:
    clamp(13px, 1.7vw, 16px);

}


.ico{

  font-size:
    clamp(38px, 6vw, 52px);

}


/* =========================================================
   BUTTONS
========================================================= */

.primary,
.control,
.back,
.unit,
.opt{

  border-radius:
    clamp(11px, 2vw, 15px);

  padding:
    11px 17px;

  font-weight:800;

}


.primary{

  background:var(--navy);

  color:#fff;

}


.primary.orange{

  background:var(--orange);

}


.back{

  background:#fff;

  color:var(--navy);

  border:1px solid var(--line);

  margin-bottom:15px;

}


/* =========================================================
   WELCOME BUTTON
========================================================= */

.welcome .primary{

  min-width:
    clamp(220px, 55vw, 400px);

  padding:
    clamp(14px, 3vw, 19px)
    clamp(18px, 4vw, 28px);

  font-size:
    clamp(16px, 2.5vw, 22px);

}


/* =========================================================
   ROW
========================================================= */

.row{

  display:flex;

  align-items:center;

  justify-content:flex-start;

  gap:12px;

  flex-wrap:wrap;

}


/* =========================================================
   GRID – UNIT
========================================================= */

.grid{

  display:grid;

  grid-template-columns:
    repeat(4, minmax(0,1fr));

  gap:
    clamp(8px, 1.5vw, 13px);

  margin:
    18px 0;

}


.unit{

  width:100%;

  min-width:0;

  background:#fff;

  border:2px solid var(--line);

  color:var(--navy);

  min-height:
    clamp(64px, 8vw, 78px);

  padding:
    10px 7px;

  overflow:hidden;

  text-overflow:ellipsis;

}


.unit small{

  display:block;

  color:var(--muted);

  font-weight:600;

  margin-top:5px;

  font-size:
    clamp(9px, 1.1vw, 12px);

  line-height:1.2;

  overflow:hidden;

}


.unit.sel{

  background:#fff3ea;

  border-color:var(--orange);

}


/* =========================================================
   WORD CARD
========================================================= */

.wordCard,
.speakWrap{

  width:100%;

  max-width:800px;

  margin:0 auto;

  text-align:center;

}


/* =========================================================
   PROGRESS BAR
========================================================= */

.bar{

  width:100%;

  height:8px;

  background:#e8ebf2;

  border-radius:99px;

  overflow:hidden;

  margin:
    14px 0 22px;

}


.bar i{

  display:block;

  height:100%;

  background:var(--orange);

}


/* =========================================================
   IMAGE
========================================================= */

.image{

  width:100%;

  max-width:570px;

  height:
    clamp(190px, 35vw, 270px);

  border:
    2px dashed #cfd5e2;

  border-radius:
    clamp(16px, 3vw, 23px);

  background:#fafbfe;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  margin:
    15px auto;

  overflow:hidden;

}


.pic{

  font-size:
    clamp(68px, 12vw, 105px);

  line-height:1;

}


.label{

  font-size:11px;

  color:#98a2b3;

  margin-top:12px;

  text-transform:uppercase;

  letter-spacing:.5px;

  overflow:hidden;

  text-overflow:ellipsis;

  max-width:90%;

}


/* =========================================================
   WORD
========================================================= */

.word{

  width:100%;

  font-size:
    clamp(30px, 5vw, 44px);

  line-height:1.15;

  font-weight:900;

  color:var(--navy);

  margin-top:12px;

  overflow-wrap:anywhere;

}


.ipa{

  font-size:
    clamp(18px, 3vw, 23px);

  color:var(--orange);

  margin:7px;

}


.meaning{

  font-size:
    clamp(17px, 2.5vw, 21px);

  color:var(--muted);

}


/* =========================================================
   SPEAKER
========================================================= */

.speaker{

  width:
    clamp(50px, 10vw, 60px);

  height:
    clamp(50px, 10vw, 60px);

  border-radius:50%;

  background:var(--navy);

  color:white;

  font-size:
    clamp(23px, 4vw, 28px);

  margin:16px 0;

  flex:none;

}


.speaker.play{

  transform:scale(1.08);

}


/* =========================================================
   MEMORY
========================================================= */

.memoryIntro{

  text-align:center;

  margin-bottom:20px;

}


.modeRules{

  display:grid;

  grid-template-columns:
    repeat(2, minmax(0,1fr));

  gap:12px;

  margin-top:18px;

}


.rule{

  border:1px solid var(--line);

  border-radius:16px;

  padding:16px;

  background:#fbfcff;

  line-height:1.45;

}


.rule b{

  display:block;

  color:var(--navy);

  margin-bottom:6px;

}


/* =========================================================
   SPEAKING
========================================================= */

.questionNo{

  font-weight:900;

  color:var(--orange);

  text-transform:uppercase;

  letter-spacing:.4px;

  line-height:1.4;

}


.timer{

  font-size:
    clamp(34px, 7vw, 44px);

  font-weight:900;

  color:var(--orange);

  min-height:58px;

  margin:10px;

}


.qtext{

  width:100%;

  font-size:
    clamp(23px, 4vw, 31px);

  line-height:1.25;

  font-weight:900;

  color:var(--navy);

  margin:18px 0;

  overflow-wrap:anywhere;

}


.answer{

  width:100%;

  font-size:
    clamp(20px, 3.5vw, 27px);

  line-height:1.3;

  font-weight:900;

  color:var(--green);

  margin:18px auto;

  overflow-wrap:anywhere;

}


.hidden{

  visibility:hidden;

  opacity:0;

}


/* =========================================================
   CONTROLS
========================================================= */

.controls{

  display:flex;

  justify-content:center;

  flex-wrap:wrap;

  gap:9px;

  margin-top:24px;

}


.control{

  background:white;

  border:1px solid var(--line);

  color:var(--navy);

}


.control:disabled{

  opacity:.45;

  cursor:not-allowed;

}


/* =========================================================
   MEMORY OPTIONS
========================================================= */

.opts{

  width:100%;

  display:grid;

  grid-template-columns:
    repeat(3, minmax(0,1fr));

  gap:
    clamp(9px, 2vw, 15px);

  margin-top:20px;

}


.opt{

  width:100%;

  min-width:0;

  background:#fff;

  border:2px solid var(--line);

  min-height:
    clamp(85px, 15vw, 125px);

  color:var(--navy);

  display:flex;

  align-items:center;

  justify-content:center;

  gap:8px;

  flex-direction:column;

  overflow:hidden;

}


.opt:hover:not(:disabled){

  border-color:var(--orange);

}


.opt.correct{

  border-color:var(--green);

  background:#ecfdf3;

  color:var(--green);

}


.opt.wrong{

  border-color:var(--red);

  background:#fef2f2;

  color:var(--red);

}


.opt .pic{

  font-size:
    clamp(45px, 9vw, 68px);

}


.memoryWordChoices .opt{

  min-height:
    clamp(65px, 10vw, 90px);

  font-size:
    clamp(17px, 3vw, 23px);

}


/* =========================================================
   RESULT
========================================================= */

.result{

  font-weight:900;

  font-size:
    clamp(17px, 3vw, 21px);

  margin-top:14px;

  min-height:28px;

}


/* =========================================================
   FINISH
========================================================= */

.finish{

  width:100%;

  max-width:680px;

  margin:
    clamp(35px, 8vw, 70px)
    auto;

  text-align:center;

}


.finish h1{

  color:var(--navy);

  font-size:
    clamp(26px, 5vw, 38px);

}


/* =========================================================
   MEMORY IMAGE ONLY
========================================================= */

.memoryImageOnly .label{

  display:none;

}


/* =========================================================
   TABLET
========================================================= */

@media(max-width:900px){

  .cards{

    grid-template-columns:
      repeat(2, minmax(0,1fr));

  }

  .grid{

    grid-template-columns:
      repeat(4, minmax(0,1fr));

  }

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

  main{

    padding:
      15px
      12px
      35px;

  }


  header{

    padding:
      12px 14px;

  }


  .cards{

    grid-template-columns:1fr;

  }


  .menu{

    min-height:150px;

  }


  .grid{

    grid-template-columns:
      repeat(2, minmax(0,1fr));

  }


  .modeRules{

    grid-template-columns:1fr;

  }


  .opts{

    grid-template-columns:1fr;

  }


  .opt{

    min-height:90px;

  }


  .welcome{

    align-items:center;

    padding:
      20px 12px;

  }


  .welcome .box{

    padding:
      25px 8px;

  }


  /*
    IMPORTANT:
    On phones the main title is allowed to wrap.
  */

  .welcome .logo{

    font-size:
      clamp(32px, 10vw, 46px);

    line-height:1.08;

    letter-spacing:0;

  }


  .welcome .logo .welcome-small{

    font-size:
      clamp(24px, 7vw, 34px);

    margin-bottom:10px;

  }


  .welcome .logo .welcome-main{

    font-size:
      clamp(32px, 9.5vw, 45px);

    white-space:normal;

    overflow-wrap:normal;

    word-break:normal;

  }


  /*
    Break "CLASS" onto a second line
    on small screens.
  */

  .welcome-main .mobile-break{

    display:block;

  }


  .welcome .sub{

    font-size:
      clamp(15px, 4.5vw, 20px);

    line-height:1.35;

    margin:
      22px auto;

  }


  .welcome-sound{

    font-size:
      clamp(14px, 4vw, 17px);

  }


  .welcome .primary{

    width:
      min(100%, 340px);

  }


  .image{

    height:
      clamp(180px, 55vw, 225px);

  }


  .pic{

    font-size:
      clamp(65px, 20vw, 90px);

  }


  .controls{

    flex-direction:column;

    width:100%;

  }


  .controls .control{

    width:100%;

  }


  .row .primary{

    width:100%;

  }

}


/* =========================================================
   VERY SMALL PHONES
========================================================= */

@media(max-width:380px){

  .welcome .logo .welcome-small{

    font-size:25px;

  }


  .welcome .logo .welcome-main{

    font-size:32px;

  }


  .welcome .sub{

    font-size:15px;

  }


  .welcome .box{

    padding:
      20px 5px;

  }


  .unit{

    font-size:14px;

  }


  .unit small{

    font-size:9px;

  }

}


/* =========================================================
   SAFE AREA – MODERN PHONES
========================================================= */

@supports(padding:max(0px)){

  .welcome{

    padding-left:
      max(12px, env(safe-area-inset-left));

    padding-right:
      max(12px, env(safe-area-inset-right));

    padding-top:
      max(18px, env(safe-area-inset-top));

    padding-bottom:
      max(18px, env(safe-area-inset-bottom));

  }


  header{

    padding-left:
      max(14px, env(safe-area-inset-left));

    padding-right:
      max(14px, env(safe-area-inset-right));

  }

}


/* =========================================================
   PREVENT HORIZONTAL OVERFLOW FROM LONG CONTENT
========================================================= */

h1,
h2,
h3,
p,
span,
div{

  overflow-wrap:break-word;

}


img,
svg,
video,
canvas{

  max-width:100%;
  height:auto;

}

</style>

</head>


<body>


<!-- =======================================================
     WELCOME
======================================================== -->

<section
  id="welcome"
  class="screen active welcome"
>

  <div class="box">


    <h1 class="logo">

      <span class="welcome-small">
        WELCOME TO
      </span>


      <span class="welcome-main">

        HENRY ENGLISH
        <span class="mobile-break">CLASS</span>

      </span>

    </h1>


    <div class="sub">

      GLOBAL SUCCESS 1 • ENGLISH
      <br class="desktop-soft-break">
      LEARNING SYSTEM

    </div>


    <div class="welcome-sound">

      🎵 Fun English sounds

    </div>


    <button
      class="primary orange"
      onclick="startWelcome()"
    >

      🚀 START / BẮT ĐẦU

    </button>


  </div>

</section>



<!-- =======================================================
     APP
======================================================== -->

<section
  id="app"
  class="screen app"
>


<header>

  <strong id="brand">
    HENRY ENGLISH
  </strong>


  <span id="langBadge">
    VI
  </span>

</header>


<main id="main"></main>


</section>

/* =========================================================
   START MULTI-UNIT SPEAKING
========================================================= */

function startSelectedSpeak(){

  if(!speakingSelected.length){

    return;

  }


  let combined=[];


  speakingSelected.forEach(u=>{

    if(!speakingData[u]){

      return;

    }


    speakingData[u].forEach(
      (q,index)=>{

        combined.push({

          ...q,

          unit:u,

          originalIndex:index

        });

      }
    );

  });


  /*
    ========================================================
    FILTER DUPLICATE QUESTIONS
    ========================================================

    "What's your name?"
    "what's your name?"

    are treated as the same question.

    The FIRST occurrence is kept.
  */

  const seenQuestions=
    new Set();


  speakingList=
    combined.filter(q=>{

      const key=
        q.question
          .trim()
          .toLowerCase();


      if(
        seenQuestions.has(key)
      ){

        return false;

      }


      seenQuestions.add(key);

      return true;

    });


  speakingIndex=0;


  showSpeak();

}

   START ONE UNIT
========================================================= */

function startSpeak(u){

  clearAll();


  speakingSelected=[u];


  speakingList=
    (speakingData[u]||[])
    .map(
      (q,index)=>({

        ...q,

        unit:u,

        originalIndex:index

      })
    );


  speakingIndex=0;


  showSpeak();

}

        onclick="nextSpeak()"
      >
        ⏭ Next
      </button>


      <button
        class="control"
        onclick="speakUnits()"
      >
        🏠 ${t("units")}
      </button>


    </div>


  </div>`;


  startSpeakTimer(q);


  speak(
    q.question,
    .72
  );

}


/* =========================================================
   SPEAKING TIMER
========================================================= */

function startSpeakTimer(q){

  let n=4;

  const e=$("timer");


  timer=setInterval(()=>{

    n--;


    if(n<=0){

      clearInterval(timer);

      timer=null;

      showSpeakAnswer(q);

    }else{

      if(e){

        e.textContent=n;

      }

    }

  },1000);

}


/* =========================================================
   SHOW ANSWER
========================================================= */

function showSpeakAnswer(q){

  const a=$("answer");

  const next=$("next");


  if(!a || !next){

    return;

  }


  a.classList.remove("hidden");


  a.textContent=
    t("answer")+
    ": "+
    q.answer;


  next.disabled=false;


  speak(
    q.answer,
    .72
  );

}


/* =========================================================
   REPLAY QUESTION
========================================================= */

function replayQ(){

  if(
    speakingList &&
    speakingList[speakingIndex]
  ){

    speak(
      speakingList[speakingIndex]
        .question,
      .72
    );

  }

}


/* =========================================================
   REPLAY ANSWER
========================================================= */

function replayA(){

  const a=$("answer");


  if(
    timer===null &&
    a &&
    !a.classList.contains("hidden") &&
    speakingList &&
    speakingList[speakingIndex]
  ){

    speak(
      speakingList[speakingIndex]
        .answer,
      .72
    );

  }

}


/* =========================================================
   NEXT
========================================================= */

function nextSpeak(){

  const next=$("next");


  if(
    next &&
    next.disabled
  ){

    return;

  }


  if(
    speakingIndex<
    speakingList.length-1
  ){

    speakingIndex++;

    showSpeak();

  }else{

    finishSpeak();

  }

}


/* =========================================================
   BACK
========================================================= */

function backSpeak(){

  if(
    speakingIndex>0
  ){

    speakingIndex--;

    showSpeak();

  }

}


/* =========================================================
   FINISH SPEAKING
========================================================= */

function finishSpeak(){

  clearAll();


  const total=
    speakingList.length;


  main.innerHTML=`

  <div class="panel finish">


    <h1>
      ${t("great")}
    </h1>


    <p>

      ${
        lang==="vi"
        ?`Bạn đã hoàn thành ${total} câu hỏi.`
        :`You completed ${total} questions.`
      }

    </p>


    ${
      speakingSelected.length>1
      ?`

      <p class="muted">

        ${
          lang==="vi"
          ?`Đã chọn ${speakingSelected.length} Unit. Các câu hỏi trùng đã được loại bỏ.`
          :`${speakingSelected.length} Units selected. Duplicate questions were removed.`
        }

      </p>

      `
      :""
    }


    <button
      class="primary"
      onclick="startSelectedSpeak()"
    >
      🔄 REPLAY
    </button>


    <button
      class="primary orange"
      onclick="speakUnits()"
    >
      ${t("units")}
    </button>


  </div>`;

}

/* =========================================================
   MEMORY CHOICES
========================================================= */

function makeChoices(x,n){

  let pool=
    list.filter(
      a=>a.word!==x.word
    );


  shuffle(pool);


  return shuffle([

    x,

    ...pool.slice(0,n)

  ]);

}


/* =========================================================
   TEXT TO SPEECH
========================================================= */

function speak(
  text,
  rate=.75
){

  if(
    !("speechSynthesis" in window)
  ){

    return;

  }


  speechSynthesis.cancel();


  const u=
    new SpeechSynthesisUtterance(
      text
    );


  u.lang="en-GB";

  u.rate=rate;

  u.pitch=1;


  speechSynthesis.speak(u);

}


/* =========================================================
   ICON
========================================================= */

function icon(x){

  const k=
    String(x)
      .toLowerCase()
      .trim();


  if(IMG[k]){

    return IMG[k];

  }


  for(
    const z in IMG
  ){

    if(
      k.includes(z)
    ){

      return IMG[z];

    }

  }


  return "🖼️";

}


/* =========================================================
   SHUFFLE
========================================================= */

function shuffle(a){

  for(
    let i=a.length-1;
    i>0;
    i--
  ){

    const j=
      Math.floor(
        Math.random()*
        (i+1)
      );


    [
      a[i],
      a[j]
    ]=[
      a[j],
      a[i]
    ];

  }


  return a;

}


/* =========================================================
   ESCAPE
========================================================= */

function esc(x){

  return String(x)
    .replace(
      /[&<>"']/g,
      m=>({

        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"

      }[m])
    );

}


/* =========================================================
   ATTRIBUTE ESCAPE
========================================================= */

function attr(x){

  return esc(x)
    .replace(
      /`/g,
      "&#96;"
    );

}


/* =========================================================
   CLEAR ALL
========================================================= */

function clearAll(){

  if(timer){

    clearInterval(timer);

    timer=null;

  }


  if(delay){

    clearTimeout(delay);

    delay=null;

  }


  if(
    "speechSynthesis" in window
  ){

    speechSynthesis.cancel();

  }

}


/* =========================================================
   WELCOME MUSIC
========================================================= */

let welcomeAudioCtx=null;

let welcomeMusicTimer=null;


function playWelcomeMusic(){

  try{

    if(!welcomeAudioCtx){

      welcomeAudioCtx=
        new(
          window.AudioContext||
          window.webkitAudioContext
        )();

    }


    if(
      welcomeAudioCtx.state===
      "suspended"
    ){

      welcomeAudioCtx.resume();

    }


    if(welcomeMusicTimer){

      return;

    }


    const notes=[

      523.25,
      659.25,
      783.99,
      659.25,
      587.33,
      698.46,
      880,
      698.46

    ];


    let i=0;


    const play=()=>{

      if(!welcomeAudioCtx){

        return;

      }


      const o=
        welcomeAudioCtx
          .createOscillator();


      const g=
        welcomeAudioCtx
          .createGain();


      o.type="triangle";


      o.frequency.value=
        notes[
          i++%
          notes.length
        ];


      g.gain.setValueAtTime(
        .0001,
        welcomeAudioCtx.currentTime
      );


      g.gain.exponentialRampToValueAtTime(
        .045,
        welcomeAudioCtx.currentTime+.02
      );


      g.gain.exponentialRampToValueAtTime(
        .0001,
        welcomeAudioCtx.currentTime+.22
      );


      o.connect(g)
       .connect(
         welcomeAudioCtx.destination
       );


      o.start();


      o.stop(
        welcomeAudioCtx.currentTime+.24
      );

    };


    play();


    welcomeMusicTimer=
      setInterval(
        play,
        280
      );

  }catch(e){}

}


function stopWelcomeMusic(){

  if(welcomeMusicTimer){

    clearInterval(
      welcomeMusicTimer
    );

    welcomeMusicTimer=null;

  }


  if(welcomeAudioCtx){

    try{

      welcomeAudioCtx.close();

    }catch(e){}


    welcomeAudioCtx=null;

  }

}


/* =========================================================
   AUTO MUSIC
========================================================= */

setTimeout(()=>{

  if(
    $("welcome")?.
      classList
      .contains("active")
  ){

    playWelcomeMusic();

  }

},300);

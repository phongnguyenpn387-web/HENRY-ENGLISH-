</style>

let grade=null,lang="vi",currentPage="home",quizMode="",quizWords=[],quizIndex=0,pronunciationWords=[],pronIndex=0,pronStop=false,speakQuestions=[],speakIndex=0,audioCtx=null;

function data(){return grade===1?G1:G3}
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function wait(ms){return new Promise(r=>setTimeout(r,ms))}
function speak(text,times=1){return new Promise(resolve=>{if(!window.speechSynthesis){resolve();return}speechSynthesis.cancel();let c=0;function one(){if(c>=times){resolve();return}c++;const u=new SpeechSynthesisUtterance(text);u.lang="en-GB";u.rate=.82;u.pitch=1.05;u.onend=()=>setTimeout(one,120);u.onerror=()=>resolve();speechSynthesis.speak(u)}one()})}
function tone(ok=true){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.type="sine";o.frequency.value=ok?660:180;g.gain.setValueAtTime(.0001,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.16,audioCtx.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+(ok?.22:.3));o.start();o.stop(audioCtx.currentTime+(ok?.24:.32));if(ok)setTimeout(()=>tone2(880),90)}catch(e){}}
function tone2(freq){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.frequency.value=freq;g.gain.setValueAtTime(.0001,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.12,audioCtx.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+.18);o.start();o.stop(audioCtx.currentTime+.2)}catch(e){}}
function transitionSound(){tone2(520);setTimeout(()=>tone2(700),100)}
function imageKeyword(word){const m={"Bill":"boy child","Wendy":"girl child","Nick":"boy child","red":"red colour","colour":"colours","my":"child pointing","your":"child pointing","his":"boy","her":"girl","this":"child pointing","that":"child pointing","fine":"happy child","how":"question child","I":"child","you":"child","old":"old child","new":"new toy","many":"many objects","some":"some objects","top":"spinning top toy","can":"tin can","washing":"washing hands","running":"child running","touch":"touch hand","open":"open door","close":"closing door","come in":"classroom entrance","go out":"classroom door","speak":"child speaking","stand up":"child standing","sit down":"child sitting","do word puzzles":"word puzzle","play badminton":"badminton child","play basketball":"basketball child","play chess":"chess child","play football":"football child","play table tennis":"table tennis child","play volleyball":"volleyball child","drawing a picture":"child drawing","listening to music":"child listening music","watching TV":"child watching tv","flying a kite":"child flying kite","painting":"child painting","skating":"child skating","skipping":"child skipping","goldfish":"goldfish","peacock":"peacock","teddy bear":"teddy bear","school bag":"school bag","pencil case":"pencil case","art room":"art classroom","computer room":"computer room","music room":"music classroom","break time":"school break"};return m[word]||word}
function img(word,lock){return `https://loremflickr.com/700/500/${encodeURIComponent(imageKeyword(word))}?lock=${lock||Math.floor(Math.random()*9999)}`}
function imgTag(word,lock,cls=""){return `<img class="${cls}" src="${img(word,lock)}" alt="${word}" onerror="this.onerror=null;this.src='https://placehold.co/700x500/e5e7eb/000055?text=${encodeURIComponent(word)}';">`}
function header(title,back){return `<div class="header"><div class="header-inner"><button class="back" onclick="${back}">← ${lang==="vi"?"Quay lại":"Back"}</button><div class="header-title">Henry English</div></div></div>`}

function render(){speechSynthesis.cancel();clearTimeout(pronTimer);clearTimeout(speakingTimer);if(currentPage==="home")return renderHome();if(currentPage==="grades")return renderGrades();if(currentPage==="modules")return renderModules();if(currentPage==="vocabUnits")return renderVocabUnits();if(currentPage.startsWith("unit:"))return renderUnit(+currentPage.split(":")[1]);if(currentPage==="memory")return renderMemory();if(currentPage.startsWith("pairs:"))return renderPairs(currentPage.split(":")[1]);if(currentPage==="pron")return renderPronunciationPage();if(currentPage==="quiz")return renderQuiz();if(currentPage==="speakPairs")return renderSpeakPairs();if(currentPage==="speaking")return renderSpeaking()}
function renderHome(){document.getElementById("app").innerHTML=`<div class="screen home"><div class="home-box"><h1 class="home-title">WELCOME TO HENRY ENGLISH CLASS</h1><div class="welcome-sub">${lang==="vi"?"Học từ vựng • Ghi nhớ • Luyện nói":"Vocabulary • Memory • Speaking"}</div><div class="welcome-sub">${lang==="vi"?"Chọn ngôn ngữ":"Choose your language"}</div><div class="lang-row"><button class="lang-btn ${lang==="vi"?"active":""}" onclick="setLang('vi')">TIẾNG VIỆT</button><button class="lang-btn ${lang==="en"?"active":""}" onclick="setLang('en')">ENGLISH</button></div><div style="height:26px"></div><button class="grade-btn" onclick="goGrades()">${lang==="vi"?"BẮT ĐẦU HỌC":"START LEARNING"}</button></div></div>`;setTimeout(()=>{tone2(620);setTimeout(()=>tone2(820),100);speak("Welcome to Henry English class!",1)},250)}
function setLang(x){lang=x;render()}function goGrades(){currentPage="grades";render()}function chooseGrade(g){grade=g;tone(true);currentPage="modules";render()}
function renderGrades(){document.getElementById("app").innerHTML=`${header(lang==="vi"?"Chọn lớp":"Choose a grade","renderHome()")}<div class="container"><h1 class="page-title">${lang==="vi"?"CHỌN LỚP":"CHOOSE A GRADE"}</h1><p class="page-sub">${lang==="vi"?"Chọn lớp để bắt đầu":"Choose a grade to begin"}</p><div class="grade-row"><button class="grade-btn" onclick="chooseGrade(1)">LỚP 1</button><button class="grade-btn" onclick="chooseGrade(3)">LỚP 3</button></div></div>`}
function renderModules(){document.getElementById("app").innerHTML=`${header("LỚP "+grade,"goGrades()")}<div class="container"><h1 class="page-title">${lang==="vi"?"CHỌN NỘI DUNG":"CHOOSE A MODULE"}</h1><div class="menu-grid"><button class="menu-btn menu-vocab" onclick="currentPage='vocabUnits';render()">📚<br>${lang==="vi"?"TỪ VỰNG":"VOCABULARY"}</button><button class="menu-btn menu-memory" onclick="currentPage='memory';render()">🧠<br>${lang==="vi"?"GHI NHỚ":"MEMORY"}</button><button class="menu-btn menu-speak" onclick="currentPage='speakPairs';render()">🗣️<br>${lang==="vi"?"LUYỆN NÓI":"SPEAKING"}</button></div></div>`}
function renderVocabUnits(){const d=data();document.getElementById("app").innerHTML=`${header(lang==="vi"?"Từ vựng":"Vocabulary","renderModules()")}<div class="container"><h1 class="page-title">${lang==="vi"?"TỪ VỰNG LỚP "+grade:"GRADE "+grade+" VOCABULARY"}</h1><div class="unit-grid">${d.map((u,i)=>`<button class="unit-btn" onclick="openUnit(${i})">UNIT ${i+1}<span>${u[0]}</span></button>`).join("")}</div></div>`}
function openUnit(i){tone(true);currentPage="unit:"+i;render()}
function renderUnit(i){const u=data()[i];document.getElementById("app").innerHTML=`${header("UNIT "+(i+1),"currentPage='vocabUnits';render()")}<div class="container"><h1 class="page-title">UNIT ${i+1}</h1><p class="page-sub">${u[0]}</p><div class="word-grid">${u[1].map((w,j)=>`<div class="word-card" onclick="speak('${w[0].replace(/'/g,"\\'")}')">${imgTag(w[0],i*100+j)}<div class="word-info"><div class="word">${w[0]}</div><div class="ipa">${w[1]}</div><div class="meaning">${w[2]}</div><button class="speak-word" onclick="event.stopPropagation();speak('${w[0].replace(/'/g,"\\'")}')">🔊 ${lang==="vi"?"Nghe":"Listen"}</button></div></div>`).join("")}</div></div>`}
function renderMemory(){document.getElementById("app").innerHTML=`${header(lang==="vi"?"Ghi nhớ":"Memory","renderModules()")}<div class="container"><h1 class="page-title">${lang==="vi"?"GHI NHỚ":"MEMORY"}</h1><div class="memory-grid"><button class="memory-btn memory-pron" onclick="quizMode='pron';currentPage='pairs:pron';render()">🔊<br>${lang==="vi"?"PHÁT ÂM":"PRONUNCIATION"}</button><button class="memory-btn memory-write" onclick="quizMode='write';currentPage='pairs:write';render()">✍️<br>${lang==="vi"?"CHỮ VIẾT":"WRITING"}</button><button class="memory-btn memory-reflex" onclick="quizMode='reflex';currentPage='pairs:reflex';render()">⚡<br>${lang==="vi"?"PHẢN XẠ":"REFLEX"}</button></div></div>`}
function pairList(){const max=grade===1?14:20;const arr=[];for(let i=0;i<max;i+=2)arr.push([i,i+1]);return arr}
function renderPairs(mode){const pairs=pairList();document.getElementById("app").innerHTML=`${header(mode==="pron"?"Phát âm":mode==="write"?"Chữ viết":"Phản xạ","currentPage='memory';render()")}<div class="container"><h1 class="page-title">${mode==="pron"?"PHÁT ÂM":mode==="write"?"CHỮ VIẾT":"PHẢN XẠ"}</h1><p class="page-sub">${lang==="vi"?"Chọn cặp Unit để học":"Choose a Unit pair"}</p><div class="pair-grid">${pairs.map((p,i)=>`<button class="pair-btn" onclick="startMode(${i})">Unit ${p[0]+1} + Unit ${p[1]+1}<span>${data()[p[0]][0]} + ${data()[p[1]][0]}</span></button>`).join("")}</div></div>`}
function startMode(i){tone(true);const p=pairList()[i];if(quizMode==="pron"){pronunciationWords=getWords(p[0],p[1]);pronIndex=0;pronStop=false;currentPage="pron";render();startPronSequence()}else{quizWords=getWords(p[0],p[1]);if(quizMode==="reflex")quizWords=shuffle(quizWords);quizIndex=0;currentPage="quiz";render()}}
function getWords(a,b){return [...data()[a][1],...data()[b][1]].map((w,i)=>({word:w[0],ipa:w[1],meaning:w[2],lock:i+a*100+b*1000}))}
function renderPronunciationPage(){const w=pronunciationWords[pronIndex];document.getElementById("app").innerHTML=`${header("Phát âm","stopPron()")}<div class="container"><div class="pron-box"><div class="progress">WORD ${pronIndex+1} / ${pronunciationWords.length}</div>${imgTag(w.word,w.lock,"quiz-image")}<div class="pron-word">${w.word}</div><div class="pron-ipa">${w.ipa}</div><div class="status" id="pronStatus">${lang==="vi"?"Chuẩn bị...":"Get ready..."}</div><div class="action-row"><button class="action skip" onclick="skipPron()">⏭️ ${lang==="vi"?"Bỏ qua":"Skip"}</button><button class="action stop" onclick="stopPron()">✖ ${lang==="vi"?"Thoát":"Exit"}</button></div></div></div>`}
async function startPronSequence(){if(pronStop)return;const w=pronunciationWords[pronIndex];if(!w){finish("pron");return}const status=document.getElementById("pronStatus");if(!status)return;for(let i=1;i<=3;i++){if(pronStop)return;status.textContent=lang==="vi"?`Nghe lần ${i} / 3`:`Listen ${i} / 3`;await speak(w.word,1);await wait(180)}for(let s=4;s>0;s--){if(pronStop)return;status.textContent=lang==="vi"?`Bạn lặp lại nhé • ${s}s`:`Repeat please • ${s}s`;await wait(1000)}pronIndex++;if(pronIndex>=pronunciationWords.length){finish("pron");return}transitionSound();render();startPronSequence()}
function skipPron(){speechSynthesis.cancel();pronIndex++;if(pronIndex>=pronunciationWords.length){finish("pron");return}transitionSound();render();startPronSequence()}
function stopPron(){pronStop=true;speechSynthesis.cancel();currentPage="pairs:pron";quizMode="pron";render()}
function renderQuiz(){if(quizIndex>=quizWords.length){finish("quiz");return}const w=quizWords[quizIndex],pool=quizWords.filter(x=>x.word!==w.word),opts=shuffle([w,...shuffle(pool).slice(0,2)]),isWrite=quizMode==="write";document.getElementById("app").innerHTML=`${header(quizMode==="write"?"Chữ viết":"Phản xạ","stopQuiz()")}<div class="container"><div class="quiz-box"><div class="progress">QUESTION ${quizIndex+1} / ${quizWords.length}</div>${isWrite?`<div class="quiz-prompt">${w.word}</div><div class="quiz-ipa">${w.ipa}</div>`:imgTag(w.word,w.lock,"quiz-image")}<div class="small-note">${isWrite?(lang==="vi"?"Chọn hình đúng với từ":"Choose the correct picture"):(lang==="vi"?"Đây là gì? Hãy chọn từ đúng":"What is this? Choose the correct word")}</div><div class="options">${opts.map((o,i)=>isWrite?`<button class="option" data-word="${o.word}" onclick="answerQuiz(${i},'${o.word.replace(/'/g,"\\'")}')">${imgTag(o.word,o.lock+i)}</button>`:`<button class="option option-text" data-word="${o.word}" onclick="answerQuiz(${i},'${o.word.replace(/'/g,"\\'")}')">${o.word}</button>`).join("")}</div><div class="timer" id="quizTimer"></div></div></div>`;window.currentOptions=opts}
async function answerQuiz(i,chosen){const buttons=[...document.querySelectorAll(".option")];buttons.forEach(b=>b.disabled=true);const correct=quizWords[quizIndex].word;buttons.forEach(b=>{if(b.dataset.word===correct)b.classList.add("correct")});if(chosen!==correct){buttons[i].classList.add("wrong");tone(false)}else tone(true);const timer=document.getElementById("quizTimer");if(timer)timer.textContent=lang==="vi"?"Đáp án: "+correct:"Answer: "+correct;await wait(350);await speak(correct,1);await wait(700);transitionSound();quizIndex++;render()}
function stopQuiz(){speechSynthesis.cancel();currentPage=`pairs:${quizMode}`;render()}
function finish(type){speechSynthesis.cancel();const back=type==="pron"?"currentPage='pairs:pron';quizMode='pron';render()":type==="quiz"?`currentPage='pairs:${quizMode}';render()`:"currentPage='modules';render()";document.getElementById("app").innerHTML=`${header("Hoàn thành","currentPage='modules';render()")}<div class="container"><div class="done"><h2>🎉 ${lang==="vi"?"Hoàn thành!":"Completed!"}</h2><p>${lang==="vi"?"Bạn đã hoàn thành toàn bộ nội dung của cặp Unit này.":"You completed this Unit pair."}</p><button class="primary" onclick="${back}">${lang==="vi"?"Học lại":"Study again"}</button></div></div>`}
function renderSpeakPairs(){const pairs=pairList();document.getElementById("app").innerHTML=`${header(lang==="vi"?"Luyện nói":"Speaking","renderModules()")}<div class="container"><h1 class="page-title">${lang==="vi"?"LUYỆN NÓI":"SPEAKING"}</h1><p class="page-sub">${lang==="vi"?"Mỗi cặp Unit có 15 câu hỏi. Hỏi xong chừa 4 giây rồi đọc đáp án.":"15 questions per Unit pair. Ask, wait 4 seconds, then play the answer."}</p><div class="pair-grid">${pairs.map((p,i)=>`<button class="pair-btn" onclick="startSpeaking(${i})">Unit ${p[0]+1} + Unit ${p[1]+1}<span>15 questions</span></button>`).join("")}</div></div>`}
function buildSpeaking(pairIndex){const p=pairList()[pairIndex],bank=grade===1?SPEAK_G1:SPEAK_G3;let q=[];[p[0]+1,p[1]+1].forEach(u=>{if(bank[u])q.push(...bank[u])});q=shuffle(q);while(q.length<15)q.push(...shuffle(q));return q.slice(0,15).map((x,i)=>({q:x[0],a:x[1],image:x[2],lock:i+500}))}
function startSpeaking(i){tone(true);speakQuestions=buildSpeaking(i);speakIndex=0;currentPage="speaking";render();runSpeaking()}
function renderSpeaking(){const x=speakQuestions[speakIndex];document.getElementById("app").innerHTML=`${header("Luyện nói","stopSpeaking()")}<div class="container"><div class="speak-box"><div class="progress">QUESTION ${speakIndex+1} / 15</div>${imgTag(x.image,x.lock,"quiz-image")}<div class="speak-question">${x.q}</div><div class="timer" id="speakTimer">${lang==="vi"?"Hãy trả lời nhé!":"Your turn!"}</div><div class="speak-answer" id="speakAnswer"></div></div></div>`}
async function runSpeaking(){if(currentPage!=="speaking")return;const x=speakQuestions[speakIndex];await speak(x.q,1);for(let s=4;s>0;s--){if(currentPage!=="speaking")return;const t=document.getElementById("speakTimer");if(t)t.textContent=lang==="vi"?`Bạn trả lời nhé • ${s}s`:`Your turn • ${s}s`;await wait(1000)}if(currentPage!=="speaking")return;const a=document.getElementById("speakAnswer");if(a)a.textContent=x.a;transitionSound();await wait(250);await speak(x.a,1);await wait(900);if(currentPage!=="speaking")return;speakIndex++;if(speakIndex>=speakQuestions.length){finishSpeaking();return}transitionSound();render();runSpeaking()}
function stopSpeaking(){speechSynthesis.cancel();currentPage="speakPairs";render()}
function finishSpeaking(){speechSynthesis.cancel();document.getElementById("app").innerHTML=`${header("Hoàn thành","currentPage='modules';render()")}<div class="container"><div class="done"><h2>🎉 ${lang==="vi"?"Hoàn thành 15 câu!":"15 questions completed!"}</h2><button class="primary" onclick="currentPage='speakPairs';render()">${lang==="vi"?"Học lại":"Study again"}</button></div></div>`}
render();
</script></body></html>

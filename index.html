<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Henry English Class – Grade 1</title>

<style>
:root{
  --navy:#000055;
  --orange:#FF6600;
  --green:#16a34a;
  --red:#dc2626;
  --bg:#f4f7fb;
  --ink:#182033;
  --card:#fff;
  --muted:#667085;
  --line:#d9deea;
}

*{box-sizing:border-box}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:var(--bg);
  color:var(--ink);
  overflow-x:hidden;
}

button{
  font:inherit;
  cursor:pointer;
  border:0;
  -webkit-tap-highlight-color:transparent;
}

button:active{
  transform:scale(.96)!important;
}

.screen{
  display:none;
  min-height:100vh;
}

.active{
  display:flex;
}

/* =========================
   WELCOME
========================= */

.welcome{
  align-items:center;
  justify-content:center;
  padding:24px max(16px,env(safe-area-inset-left))
           max(24px,env(safe-area-inset-bottom))
           max(16px,env(safe-area-inset-right));
  background:
    radial-gradient(circle at 20% 20%,rgba(255,166,0,.16),transparent 22%),
    radial-gradient(circle at 80% 75%,rgba(86,104,255,.16),transparent 25%),
    linear-gradient(135deg,#000055,#08086d,#17117d);
  position:relative;
  overflow:hidden;
}

.welcome:before,
.welcome:after{
  content:"";
  position:absolute;
  border-radius:50%;
  pointer-events:none;
}

.welcome:before{
  width:260px;
  height:260px;
  left:-100px;
  top:-80px;
  background:rgba(255,166,0,.08);
}

.welcome:after{
  width:330px;
  height:330px;
  right:-140px;
  bottom:-120px;
  background:rgba(99,102,241,.12);
}

.welcome .box{
  width:min(900px,100%);
  text-align:center;
  background:rgba(255,255,255,.035);
  border:1px solid rgba(255,255,255,.09);
  border-radius:34px;
  padding:55px 28px;
  box-shadow:0 25px 80px rgba(0,0,0,.25);
  position:relative;
  z-index:1;
  animation:welcomeIn .7s ease both;
}

@keyframes welcomeIn{
  from{opacity:0;transform:translateY(25px) scale(.97)}
  to{opacity:1;transform:translateY(0) scale(1)}
}

.logo{
  font-size:clamp(28px,6vw,54px);
  font-weight:900;
  color:var(--orange);
  margin:0 0 12px;
  text-shadow:0 3px 14px rgba(0,0,0,.35);
}

.logo span:first-child{
  color:#fff;
}

.logo span:last-child{
  color:var(--orange);
}

.welcome-line{
  display:block!important;
  width:100%;
  white-space:normal!important;
  overflow-wrap:normal!important;
  word-break:normal!important;
}

.sub{
  font-size:18px;
  color:#fff;
  margin-bottom:30px;
  opacity:.9;
}

.welcome .primary{
  min-width:240px;
  font-size:18px;
  padding:16px 28px;
}

/* =========================
   APP
========================= */

.app{
  width:100%;
  flex-direction:column;
  background:
    radial-gradient(circle at 8% 14%,rgba(255,193,92,.22),transparent 19%),
    radial-gradient(circle at 92% 18%,rgba(116,179,255,.18),transparent 22%),
    radial-gradient(circle at 14% 88%,rgba(255,142,178,.13),transparent 18%),
    linear-gradient(180deg,#f8fbff 0%,#edf4ff 48%,#f8f3ff 100%);
  position:relative;
}

.app:before,
.app:after{
  content:"";
  position:fixed;
  z-index:0;
  pointer-events:none;
  border-radius:999px;
}

.app:before{
  width:180px;
  height:180px;
  left:-70px;
  top:120px;
  background:rgba(255,214,126,.18);
}

.app:after{
  width:220px;
  height:220px;
  right:-95px;
  bottom:35px;
  background:rgba(148,196,255,.18);
}

header{
  background:linear-gradient(105deg,#07075d 0%,#101078 48%,#28208d 100%);
  color:white;
  padding:13px clamp(18px,4vw,42px);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  position:sticky;
  top:0;
  z-index:20;
  min-height:72px;
  box-shadow:0 8px 28px rgba(10,13,80,.20);
  border-bottom:1px solid rgba(255,255,255,.12);
}

header strong{
  font-size:clamp(16px,2vw,22px);
  letter-spacing:.5px;
}

#langBadge{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:44px;
  height:38px;
  padding:0 12px;
  border-radius:999px;
  background:rgba(255,255,255,.15);
  border:1px solid rgba(255,255,255,.22);
  font-weight:900;
  letter-spacing:.7px;
}

main{
  width:min(1240px,100%);
  margin:0 auto;
  padding:28px 24px 56px;
  flex:1;
  position:relative;
  z-index:1;
}

/* =========================
   PAGE TRANSITION
========================= */

#main.page-enter{
  animation:pageEnter .35s ease both;
}

@keyframes pageEnter{
  from{
    opacity:0;
    transform:translateY(12px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.title{
  text-align:center;
  color:#10135f;
  font-size:clamp(25px,4vw,38px);
  margin:12px 0 30px;
  font-weight:900;
  line-height:1.12;
  text-shadow:0 2px 0 rgba(255,255,255,.8);
}

.title:after{
  content:"";
  display:block;
  width:68px;
  height:6px;
  margin:12px auto 0;
  border-radius:99px;
  background:linear-gradient(90deg,#ffbd3f,#ff6f7f,#7467e8);
}

/* =========================
   PANEL
========================= */

.panel{
  position:relative;
  overflow:hidden;
  background:rgba(255,255,255,.94);
  border:1px solid rgba(208,219,239,.9);
  border-radius:26px;
  padding:28px;
  box-shadow:0 18px 45px rgba(40,64,106,.12);
  animation:cardIn .35s ease both;
}

@keyframes cardIn{
  from{
    opacity:0;
    transform:translateY(10px) scale(.99);
  }
  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}

.panel:before{
  content:"";
  position:absolute;
  left:0;
  top:0;
  width:100%;
  height:5px;
  background:linear-gradient(
    90deg,
    #ffbd3f 0%,
    #ff7d72 32%,
    #6f78ec 66%,
    #55c69b 100%
  );
}

.panel h2{
  color:#12165f;
  font-size:clamp(23px,3vw,32px);
  margin-top:4px;
  text-align:center;
}

.muted{
  color:#66718b;
}

/* =========================
   BUTTONS
========================= */

.primary,
.control,
.back,
.unit,
.opt{
  border-radius:15px;
  font-weight:800;
  transition:
    transform .16s,
    box-shadow .16s,
    filter .16s,
    border-color .16s;
}

.primary{
  background:linear-gradient(135deg,#17136d,#3731a4);
  color:#fff;
  padding:13px 22px;
  box-shadow:0 8px 18px rgba(39,31,128,.22);
}

.primary.orange{
  background:linear-gradient(135deg,#ff9f1c,#ff6b35);
  box-shadow:0 8px 18px rgba(255,112,53,.25);
}

.primary:hover{
  transform:translateY(-3px);
  filter:brightness(1.05);
  box-shadow:0 13px 25px rgba(39,31,128,.28);
}

.primary.orange:hover{
  box-shadow:0 13px 25px rgba(255,112,53,.3);
}

.back{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:50px;
  padding:10px 22px;
  margin-bottom:15px;
  background:rgba(255,255,255,.9);
  color:#12175f;
  border:1px solid #dbe3f1;
  box-shadow:0 8px 20px rgba(28,48,85,.1);
}

.back:hover{
  transform:translateX(-3px);
  background:#fff;
}

.control{
  background:#fff;
  border:1.5px solid #dce4f0;
  color:#10165f;
  padding:12px 17px;
  box-shadow:0 5px 12px rgba(43,62,99,.08);
}

.control:hover:not(:disabled){
  transform:translateY(-2px);
  border-color:#8d84ec;
  box-shadow:0 10px 18px rgba(73,69,164,.13);
}

.control:disabled{
  opacity:.4;
  cursor:not-allowed;
}

.row{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  flex-wrap:wrap;
}

/* =========================
   MAIN CARDS
========================= */

.cards{
  width:min(1120px,100%);
  margin:0 auto;
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:24px;
}

.cards .menu{
  position:relative;
  overflow:hidden;
  min-height:260px;
  border:0;
  border-radius:28px;
  background:linear-gradient(145deg,#fff 0%,#f8fbff 100%);
  box-shadow:0 16px 36px rgba(38,60,99,.14);
  padding:30px 20px 24px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  transition:
    transform .2s,
    box-shadow .2s;
}

.cards .menu:before{
  content:"";
  position:absolute;
  width:140px;
  height:140px;
  border-radius:50%;
  top:-72px;
  right:-52px;
  background:rgba(255,184,62,.14);
}

.cards .menu:after{
  content:"";
  position:absolute;
  left:50%;
  bottom:18px;
  transform:translateX(-50%);
  width:58px;
  height:6px;
  border-radius:99px;
  background:linear-gradient(90deg,#ffc342,#ff8c55);
}

.cards .memory:before{
  background:rgba(132,115,245,.14);
}

.cards .memory:after{
  background:linear-gradient(90deg,#786cf0,#b276ef);
}

.cards .speak:before{
  background:rgba(67,197,161,.14);
}

.cards .speak:after{
  background:linear-gradient(90deg,#40c6a0,#50a7df);
}

.cards .menu:hover{
  transform:translateY(-8px);
  box-shadow:0 24px 44px rgba(38,60,99,.20);
}

.cards .menu .ico{
  font-size:64px;
  min-height:74px;
  display:flex;
  align-items:center;
  justify-content:center;
  filter:drop-shadow(0 7px 6px rgba(27,40,80,.12));
  position:relative;
  z-index:1;
  animation:floatIcon 3s ease-in-out infinite;
}

@keyframes floatIcon{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-5px)}
}

.cards .menu h2{
  font-size:clamp(24px,2.5vw,32px);
  margin:12px 0 8px;
  color:#141a63;
  position:relative;
  z-index:1;
}

.cards .menu p{
  font-weight:700;
  color:#7a849c;
  position:relative;
  z-index:1;
}

/* =========================
   MEMORY MENU
========================= */

.menuGrid{
  width:min(1080px,100%);
  margin:0 auto;
  display:grid;
  grid-template-columns:repeat(6,minmax(0,1fr));
  gap:18px;
}

.memoryGrid .menu{
  grid-column:span 2;
}

.memoryGrid .menu:nth-child(4){
  grid-column:2 / span 2;
}

.memoryGrid .menu:nth-child(5){
  grid-column:4 / span 2;
}

.menuGrid .menu{
  position:relative;
  overflow:hidden;
  min-height:205px;
  padding:26px 18px;
  border:2px solid transparent;
  border-radius:26px;
  background:
    linear-gradient(#fff,#fff) padding-box,
    linear-gradient(135deg,#ffd35d,#ffad72,#9cb8ff) border-box;
  box-shadow:0 14px 30px rgba(38,60,99,.11);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  gap:10px;
  transition:.2s;
}

.menuGrid .menu:before{
  content:"";
  position:absolute;
  width:95px;
  height:95px;
  border-radius:50%;
  top:-44px;
  right:-38px;
  background:rgba(255,205,83,.13);
}

.menuGrid .menu:nth-child(2):before{
  background:rgba(101,164,255,.13);
}

.menuGrid .menu:nth-child(3):before{
  background:rgba(146,108,245,.13);
}

.menuGrid .menu:nth-child(4):before{
  background:rgba(70,194,148,.13);
}

.menuGrid .menu:nth-child(5):before{
  background:rgba(244,104,159,.13);
}

.menuGrid .menu:after{
  content:"";
  width:52px;
  height:5px;
  border-radius:99px;
  background:#ffb23d;
  position:absolute;
  bottom:19px;
  left:50%;
  transform:translateX(-50%);
}

.menuGrid .menu:nth-child(2):after{background:#6198ed}
.menuGrid .menu:nth-child(3):after{background:#8e72e9}
.menuGrid .menu:nth-child(4):after{background:#49b98a}
.menuGrid .menu:nth-child(5):after{background:#ed6b9f}

.menuGrid .menu:hover{
  transform:translateY(-5px) scale(1.01);
  box-shadow:0 21px 38px rgba(38,60,99,.17);
}

.menuGrid .menu .ico{
  font-size:56px;
  line-height:1;
}

.menuGrid .menu h2{
  color:#141a63;
  font-weight:900;
  margin:0;
}

/* =========================
   UNIT GRID
========================= */

.grid{
  width:min(100%,920px);
  margin:24px auto;
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:14px;
}

.unit{
  position:relative;
  overflow:hidden;
  min-height:82px;
  padding:12px 10px;
  background:linear-gradient(145deg,#fff,#f7faff);
  border:1.5px solid #dce5f4;
  color:#151b66;
  box-shadow:0 4px 12px #24324b08;
}

.unit:before{
  content:"";
  position:absolute;
  width:48px;
  height:48px;
  border-radius:50%;
  right:-20px;
  top:-20px;
  background:rgba(255,190,71,.13);
}

.unit:nth-child(3n):before{
  background:rgba(117,129,237,.12);
}

.unit:nth-child(3n+2):before{
  background:rgba(70,194,148,.12);
}

.unit:hover{
  transform:translateY(-3px);
  box-shadow:0 10px 20px rgba(36,50,75,.12);
  border-color:#9d94ef;
}

.unit.sel{
  background:linear-gradient(145deg,#fff6e7,#fff);
  border-color:#ff9b39;
  box-shadow:0 10px 22px rgba(255,154,57,.18);
}

.unit small{
  display:block;
  color:#778198;
  font-weight:600;
  margin-top:5px;
  font-size:11px;
  line-height:1.2;
}

/* =========================
   WORD / SPEAKING
========================= */

.wordCard,
.speakWrap{
  text-align:center;
  max-width:900px;
  margin:auto;
}

.questionNo{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:34px;
  padding:7px 14px;
  border-radius:999px;
  background:#fff4df;
  color:#d87900;
  font-size:13px;
  font-weight:900;
  box-shadow:inset 0 0 0 1px #ffe0a5;
}

.bar{
  height:12px;
  background:#edf1f8;
  border-radius:99px;
  padding:2px;
  overflow:hidden;
  margin:14px 0 22px;
  box-shadow:inset 0 2px 5px rgba(45,65,100,.08);
}

.bar i{
  display:block;
  height:100%;
  border-radius:99px;
  background:linear-gradient(90deg,#ffbd3f,#ff7b65,#7b73e9);
  transition:width .35s ease;
}

.image{
  height:260px;
  border:2px solid #e3e9f5;
  border-radius:22px;
  background:
    radial-gradient(circle at 50% 35%,#fff 0%,#f5f8ff 65%,#edf3ff 100%);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  margin:15px auto;
  max-width:560px;
  box-shadow:0 12px 28px rgba(44,67,109,.09);
}

.pic{
  font-size:100px;
  line-height:1;
  filter:drop-shadow(0 10px 7px rgba(36,50,85,.13));
  animation:picPop .35s ease both;
}

@keyframes picPop{
  from{
    opacity:0;
    transform:scale(.75) rotate(-4deg);
  }
  to{
    opacity:1;
    transform:scale(1) rotate(0);
  }
}

.label{
  font-size:11px;
  color:#98a2b3;
  margin-top:12px;
  text-transform:uppercase;
  letter-spacing:.5px;
}

.word{
  font-size:42px;
  font-weight:900;
  color:#121866;
  margin-top:12px;
  text-shadow:0 2px 0 #fff;
  animation:wordIn .3s ease both;
}

@keyframes wordIn{
  from{opacity:0;transform:translateY(7px)}
  to{opacity:1;transform:translateY(0)}
}

.ipa{
  display:inline-block;
  font-size:22px;
  color:#ef741e;
  margin:8px;
  padding:6px 14px;
  border-radius:999px;
  background:#fff2e7;
  font-weight:800;
}

.meaning{
  font-size:20px;
  color:#65708b;
  font-weight:700;
}

.speaker{
  width:62px;
  height:62px;
  border-radius:50%;
  background:linear-gradient(145deg,#17136d,#4038af);
  color:white;
  font-size:27px;
  margin:16px 0;
  box-shadow:0 10px 20px rgba(43,35,137,.25);
  border:3px solid #fff;
  transition:transform .16s,box-shadow .16s;
}

.speaker:hover{
  transform:scale(1.09);
  box-shadow:0 14px 26px rgba(43,35,137,.32);
}

.speaker.play{
  transform:scale(1.1);
}

/* =========================
   TIMER
========================= */

.timer{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:86px;
  height:86px;
  padding:0 20px;
  border-radius:50%;
  background:linear-gradient(145deg,#fff9ee,#fff);
  border:5px solid #ffe0a5;
  color:#f18b18;
  font-size:42px;
  font-weight:900;
  box-shadow:0 10px 25px rgba(243,154,41,.18);
  transition:
    transform .15s,
    border-color .15s,
    color .15s;
}

.timer.tick{
  animation:timerTick .18s ease;
}

.timer.last{
  color:#dc2626;
  border-color:#ffb0b0;
  background:#fff5f5;
}

@keyframes timerTick{
  0%{transform:scale(1)}
  50%{transform:scale(1.12)}
  100%{transform:scale(1)}
}

/* =========================
   ANSWERS
========================= */

.qtext{
  font-size:30px;
  font-weight:900;
  color:#10165f;
  margin:18px 0;
  line-height:1.3;
  animation:questionIn .35s ease both;
}

@keyframes questionIn{
  from{opacity:0;transform:translateX(12px)}
  to{opacity:1;transform:translateX(0)}
}

.answer{
  font-size:26px;
  font-weight:900;
  color:var(--green);
  margin:18px;
  line-height:1.35;
}

.answer.reveal{
  animation:answerReveal .45s ease both;
}

@keyframes answerReveal{
  0%{
    opacity:0;
    transform:translateY(15px) scale(.94);
  }
  60%{
    transform:translateY(-3px) scale(1.02);
  }
  100%{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}

.hidden{
  visibility:hidden;
  opacity:0;
}

.memoryFeedback{
  min-height:30px;
  font-weight:900;
  font-size:20px;
  color:#23247a;
  margin-top:10px;
}

.feedbackGood{
  color:#16a34a!important;
  animation:feedbackPop .35s ease;
}

.feedbackBad{
  color:#dc2626!important;
  animation:feedbackPop .35s ease;
}

@keyframes feedbackPop{
  0%{transform:scale(.85);opacity:0}
  70%{transform:scale(1.08)}
  100%{transform:scale(1);opacity:1}
}

/* =========================
   OPTIONS
========================= */

.opts{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
  width:min(900px,100%);
  margin:20px auto;
}

.opt{
  min-height:100px;
  background:linear-gradient(145deg,#fff,#f9fbff);
  border:2px solid #e0e7f2;
  color:#10165f;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  flex-direction:column;
  box-shadow:0 8px 20px rgba(43,62,99,.08);
}

.opt:hover:not(:disabled){
  transform:translateY(-4px);
  border-color:#8c83ed;
  box-shadow:0 14px 25px rgba(84,76,180,.14);
}

.opt.correct{
  background:linear-gradient(145deg,#effdf5,#fff);
  border-color:#32bd7b;
  color:#16a34a;
  animation:correctPop .4s ease;
}

.opt.wrong{
  background:linear-gradient(145deg,#fff2f2,#fff);
  border-color:#f06f70;
  color:#dc2626;
  animation:wrongShake .4s ease;
}

@keyframes correctPop{
  0%{transform:scale(1)}
  50%{transform:scale(1.06)}
  100%{transform:scale(1)}
}

@keyframes wrongShake{
  0%,100%{transform:translateX(0)}
  25%{transform:translateX(-7px)}
  75%{transform:translateX(7px)}
}

.opt .pic{
  font-size:78px;
}

.result{
  font-weight:900;
  font-size:20px;
  margin-top:14px;
  min-height:28px;
}

.controls{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:9px;
  margin-top:24px;
}

/* =========================
   MEMORY
========================= */

.memorySilentImage{
  height:320px;
}

.memorySilentImage .pic{
  font-size:150px;
}

/* =========================================================

========================================================= */

let audioCtx=null;

function getAudio(){
  try{
    audioCtx=audioCtx||
      new(window.AudioContext||window.webkitAudioContext)();

    if(audioCtx.state==="suspended"){
      audioCtx.resume();
    }

    return audioCtx;
  }catch(e){
    return null;
  }
}

function tone(freq=600,duration=.08,type="sine",volume=.045,endFreq=null){
  try{
    const ctx=getAudio();
    if(!ctx)return;

    const now=ctx.currentTime;
    const osc=ctx.createOscillator();
    const gain=ctx.createGain();

    osc.type=type;
    osc.frequency.setValueAtTime(freq,now);

    if(endFreq){
      osc.frequency.exponentialRampToValueAtTime(
        endFreq,
        now+duration
      );
    }

    gain.gain.setValueAtTime(volume,now);
    gain.gain.exponentialRampToValueAtTime(
      .001,
      now+duration
    );

    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.start(now);
    osc.stop(now+duration+.01);
  }catch(e){}
}

/* =========================================================
   TIMER SOUND
========================================================= */

function startCountdown(seconds,elementId,onFinish){
  clearTimerOnly();

  let n=seconds;
  const e=$(elementId);

  if(e){
    e.textContent=n;
    e.classList.remove("last");
  }

  timer=setInterval(()=>{
    n--;

    if(e){
      e.textContent=n;

      e.classList.remove("tick");
      void e.offsetWidth;
      e.classList.add("tick");

      if(n<=2){
        e.classList.add("last");
      }
    }

    playTickSound(n<=2);

    if(n<=0){
      clearTimerOnly();
      playTimeUpSound();

      if(typeof onFinish==="function"){
        setTimeout(onFinish,180);
      }
    }
  },1000);
}

function clearTimerOnly(){
  if(timer){
    clearInterval(timer);
    timer=null;
  }
}

function playWordThreeTimes(word){

  let count=0;
  const status=$("listenStatus");

  function once(){

    if(count>=3){

      if(status){
        status.textContent=
          lang==="vi"
            ?"⏱ Hãy đọc lại!"
            :"⏱ Your turn!";
      }

      startListenRepeatCountdown();
      return;
    }

    count++;

    if(status){
      status.textContent="🔊 "+count+" / 3";
    }

    speak(word,.7);

    delay=setTimeout(once,1400);
  }

  once();
}

function startListenRepeatCountdown(){

  startCountdown(
    4,
    "timer",
    ()=>{
      idx++;
      showListenRepeat();

  );
}

            aria-label="${attr(c.word)}"
            onclick="memoryChoiceAnswer(
              this,
              '${attr(c.word)}',
              '${attr(x.word)}',
              'wordPicture'
            )">

            <span class="pic">
              ${icon(c.word)}
            </span>

          </button>
        `).join("")}

      </div>

      <div id="result"
           class="memoryFeedback">
      </div>

    </div>
  `;

  animatePage();
}

/* =========================================================
   PICTURE → WORD
========================================================= */

function showPictureChooseWord(){

  clearAll();

  if(idx>=list.length){
    finishMemory();
    return;
  }

  const x=list[idx];
  const choices=makeChoices(x,2);

  main.innerHTML=`

    <button class="back"
            onclick="memoryUnits('pictureWord')">
      ${t("back")}
    </button>

    <div class="panel wordCard">

      <div class="questionNo">
        🖼️
        ${lang==="vi"
          ?"Nhìn hình → chọn chữ"
          :"Picture → Word"}
        • ${idx+1}/${list.length}
      </div>

      <div class="bar">
        <i style="width:${(idx+1)/list.length*100}%"></i>
      </div>

      <div class="image memorySilentImage">
        <div class="pic">
          ${icon(x.word)}
        </div>
      </div>

      <p class="muted">
        ${lang==="vi"
          ?"Chọn từ đúng."
          :"Choose the correct word."}
      </p>

      <div class="opts">

        ${choices.map(c=>`
          <button
            class="opt"
            aria-label="${attr(c.word)}"
            onclick="memoryChoiceAnswer(
              this,
              '${attr(c.word)}',
              '${attr(x.word)}',
              'pictureWord'
            )">

            <span>${esc(c.word)}</span>

          </button>
        `).join("")}

      </div>

      <div id="result"
           class="memoryFeedback">
      </div>

    </div>
  `;

  animatePage();
}

/* =========================================================
   MEMORY ANSWER
========================================================= */

function memoryChoiceAnswer(
  btn,
  val,
  correct,
  nextMode
){

  if(btn.disabled)return;

  const ok=val===correct;

  if(ok){
    score++;
    playCorrectSound();
  }else{
    playWrongSound();
  }

  document
    .querySelectorAll(".opt")
    .forEach(b=>b.disabled=true);

  btn.classList.add(
    ok?"correct":"wrong"
  );

  if(!ok){

    document
      .querySelectorAll(".opt")
      .forEach(b=>{

        if(
          b.getAttribute("aria-label")
          ===correct
        ){
          b.classList.add("correct");
        }

      });
  }

  if($("result")){

    $("result").textContent=
      ok?t("correct"):t("wrong");

    $("result").className=
      "memoryFeedback "+
      (ok?"feedbackGood":"feedbackBad");
  }

  speak(correct,.7);

  delay=setTimeout(()=>{

    idx++;

    if(nextMode==="wordPicture"){
      showWordChoosePicture();
    }else{
      showPictureChooseWord();
    }

  },1500);
}

/* =========================================================
   MEMORY FINISH
========================================================= */

function finishMemory(){

  clearAll();
  playFinishSound();

  main.innerHTML=`

    <div class="panel finish">

      <h1>${t("great")}</h1>

      <p>
        ${idx}
        ${lang==="vi"
          ?"từ đã hoàn thành."
          :"words completed."}
      </p>

      <p>
        Score: ${score}/${list.length}
      </p>

      <button class="primary"
              onclick="startMemory()">
        🔄 REPLAY
      </button>

      <button class="primary orange"
              onclick="memoryUnits('${mode}')">
        ${t("units")}
      </button>

    </div>
  `;

  animatePage();
}

/* =========================================================
   CHOICES
========================================================= */

function makeChoices(x,n){

  let pool=list.filter(
    a=>a.word!==x.word
  );

  shuffle(pool);

  return shuffle([
    x,
    ...pool.slice(0,n)
  ]);
}

/* =========================================================
   SPEAKING
========================================================= */

function speakUnits(){

  clearAll();
  speakingSelected=[];

  main.innerHTML=`

    <button class="back"
            onclick="home()">
      ${t("back")}
    </button>

    <div class="panel">

      <h2>${t("speak")}</h2>

      <p class="muted">
        ${lang==="vi"
          ?"Chọn một hoặc nhiều Unit. Nếu chọn từ 2 Unit trở lên, câu hỏi trùng nhau chỉ xuất hiện 1 lần."
          :"Choose one or more Units. When 2 or more Units are selected, duplicate questions appear only once."}
      </p>

      ${unitsSpeak()}

      <div class="row">

        <button class="primary orange"
                onclick="startSelectedSpeak()">
          ${t("start")}
        </button>

        <span id="speakCount"
              class="muted">
          0 ${t("sel")}
        </span>

      </div>

    </div>
  `;

  animatePage();
}

function unitsSpeak(){

  let s='<div class="grid">';

  for(let i=1;i<=16;i++){

    s+=`
      <button class="unit"
              id="su${i}"
              onclick="toggleSpeakUnit(${i})">

        UNIT ${i}

        <small>
          ${esc(unitTitles[i]||"")}
        </small>

      </button>
    `;
  }

  return s+"</div>";
}

function toggleSpeakUnit(i){

  const e=$("su"+i);

  if(speakingSelected.includes(i)){

    speakingSelected=
      speakingSelected.filter(
        x=>x!==i
      );

    e.classList.remove("sel");

  }else{

    speakingSelected.push(i);
    e.classList.add("sel");
  }

  if($("speakCount")){

    $("speakCount").textContent=
      speakingSelected.length+
      " "+
      t("sel");
  }
}

function startSelectedSpeak(){

  if(!speakingSelected.length)return;

  clearAll();

  let combined=
    speakingSelected.flatMap(
      u=>
        (speakingData[u]||[])
        .map(q=>({
          question:q[0],
          answer:q[1],
          image:q[2],
          unit:u
        }))
    );

  const seen=new Set();

  speakingList=
    combined.filter(q=>{

      const key=
        q.question
          .trim()
          .toLowerCase();

      if(seen.has(key)){
        return false;
      }

      seen.add(key);
      return true;
    });

  speakingIndex=0;

  showSpeak();
}

function startSpeak(u){

  speakingSelected=[u];
  startSelectedSpeak();
}

/* =========================================================
   SPEAKING QUESTION
========================================================= */

function showSpeak(){

  clearAll();

  if(
    speakingIndex>=
    speakingList.length
  ){
    finishSpeak();
    return;
  }

  const q=
    speakingList[speakingIndex];

  main.innerHTML=`

    <button class="back"
            onclick="speakUnits()">
      ${t("back")}
    </button>

    <div class="panel speakWrap">

      <div class="questionNo">
        UNIT ${q.unit}
        • QUESTION
        ${speakingIndex+1}/${speakingList.length}
      </div>

      <div class="bar">
        <i style="
          width:${
            (speakingIndex+1)/
            speakingList.length*
            100
          }%
        "></i>
      </div>

      <div class="image">

        <div class="pic">
          ${icon(q.image||q.answer)}
        </div>

        <div class="label">
          IMAGE
        </div>

      </div>

      <div class="qtext">
        ${esc(q.question)}
      </div>

      <button class="speaker"
              onclick="replayQ()">
        🔊
      </button>

      <div class="muted">
        ${lang==="vi"
          ?"Hãy tự trả lời. Đáp án mẫu chỉ xuất hiện sau 4 giây."
          :"Answer yourself. The model answer appears after 4 seconds."}
      </div>

      <div id="timer"
           class="timer">
        4
      </div>

      <div id="answer"
           class="answer hidden">
        ${t("answer")}
      </div>

      <div class="controls">

        <button class="control"
                onclick="backSpeak()"
                ${speakingIndex===0?"disabled":""}>
          ← Back
        </button>

        <button class="control"
                onclick="replayQ()">
          🔊 Replay Question
        </button>

        <button class="control"
                onclick="replayA()">
          🔊 Replay Answer
        </button>

        <button id="next"
                class="control next"
                disabled
                onclick="nextSpeak()">
          ⏭ Next
        </button>

        <button class="control"
                onclick="speakUnits()">
          🏠 ${t("units")}
        </button>

      </div>

    </div>
  `;

  animatePage();

  startSpeakTimer(q);

  speak(q.question,.72);
}

function startSpeakTimer(q){

  startCountdown(
    4,
    "timer",
    ()=>{
      showSpeakAnswer(q);
    }
  );
}

function showSpeakAnswer(q){

  const a=$("answer");
  const next=$("next");

  if(!a||!next)return;

  a.classList.remove("hidden");

  a.classList.add("reveal");

  a.textContent=
    t("answer")+": "+q.answer;

  next.disabled=false;

  speak(q.answer,.72);
}

function replayQ(){

  if(
    speakingList[speakingIndex]
  ){
    speak(
      speakingList[speakingIndex]
        .question,
      .72
    );
  }
}

function replayA(){

  if(
    timer===null &&
    speakingList[speakingIndex] &&
    $("answer") &&
    !$("answer").classList.contains("hidden")
  ){

    speak(
      speakingList[speakingIndex]
        .answer,
      .72
    );
  }
}

function nextSpeak(){

  if($("next")?.disabled)return;

  if(
    speakingIndex<
    speakingList.length-1
  ){

    speakingIndex++;
    showSpeak();

  }else{

    finishSpeak();
  }
}

function backSpeak(){

  if(speakingIndex>0){

    speakingIndex--;
    showSpeak();

  }
}

/* =========================================================
   SPEAKING FINISH
========================================================= */

function finishSpeak(){

  clearAll();
  playFinishSound();

  main.innerHTML=`

    <div class="panel finish">

      <h1>${t("great")}</h1>

      <p>
        ${
          speakingSelected.length>1
            ?speakingSelected.length+" Units"
            :"Unit "+speakingSelected[0]
        }

        –
        ${speakingList.length}

        ${lang==="vi"
          ?"câu"
          :"questions"}
      </p>

      <button class="primary"
              onclick="startSelectedSpeak()">
        🔄 REPLAY
      </button>

      <button class="primary orange"
              onclick="speakUnits()">
        ${t("units")}
      </button>

    </div>
  `;

  animatePage();
}

/* =========================================================
   GENERAL FUNCTIONS
========================================================= */

function startWelcome(){
  language();
}

function stopSpeechOnly(){

  if(
    "speechSynthesis"
    in window
  ){
    speechSynthesis.cancel();
  }
}

function clearAll(){

  clearTimerOnly();

  if(delay){
    clearTimeout(delay);
    delay=null;
  }

  stopSpeechOnly();
}

function shuffle(a){

  for(
    let i=a.length-1;
    i>0;
    i--
  ){

    let j=
      Math.floor(
        Math.random()*(i+1)
      );

    [
      a[i],
      a[j]
    ]=[
      a[j],
      a[i]
    ];
  }

  return a;
}

function speak(
  text,
  rate=.75
){

  if(
    !("speechSynthesis" in window)
  )return;

  speechSynthesis.cancel();

  const u=
    new SpeechSynthesisUtterance(
      text
    );

  u.lang="en-GB";
  u.rate=rate;
  u.pitch=1;

  speechSynthesis.speak(u);
}

function icon(x){

  const k=
    String(x)
      .toLowerCase()
      .trim();

  if(IMG[k]){
    return IMG[k];
  }

  for(
    let z in IMG
  ){

    if(
      k.includes(z)
    ){
      return IMG[z];
    }
  }

  return "🖼️";
}

function esc(x){

  return String(x)
    .replace(
      /[&<>"']/g,
      m=>({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"
      }[m])
    );
}

function attr(x){

  return esc(x)
    .replace(
      /`/g,
      "&#96;"
    );
}

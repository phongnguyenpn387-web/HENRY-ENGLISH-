<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Henry English Class</title>
<style>
:root{--navy:#000055;--orange:#FF6600;--green:#20a464;--red:#e53935;--bg:#f4f7fb;--card:#fff;--ink:#152238}
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;border:0;cursor:pointer}.screen{min-height:100vh;padding:24px;display:none}.screen.active{display:block}
.welcome{background:var(--navy);color:white;display:flex;align-items:center;justify-content:center;text-align:center}
.welcome h1{font-size:clamp(32px,7vw,68px);margin:0 0 28px;color:var(--orange);font-weight:900;text-shadow:0 4px 0 rgba(0,0,0,.15)}
.welcome p{font-size:20px;opacity:.9}.pulse{animation:pulse 1.2s infinite}@keyframes pulse{50%{transform:scale(1.03)}}
.wrap{max-width:1100px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}
.logo{font-weight:900;color:var(--navy);font-size:24px}.small{font-size:13px;color:#667}
.btn{padding:13px 18px;border-radius:14px;background:var(--navy);color:#fff;font-weight:800;box-shadow:0 5px 14px #0002;transition:.15s}.btn:hover{transform:translateY(-2px)}
.btn.light{background:#fff;color:var(--navy)}.btn.orange{background:var(--orange)}.btn.green{background:var(--green)}.btn.red{background:var(--red)}
.hero{background:linear-gradient(135deg,var(--navy),#101078);color:#fff;border-radius:26px;padding:28px;margin-bottom:22px}
.hero h2{margin:0 0 8px;font-size:34px}.hero p{margin:0;opacity:.9}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.card{background:var(--card);border-radius:22px;padding:22px;box-shadow:0 8px 28px #00000012}
.choice{min-height:120px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:24px;font-weight:900}
.grade{background:#fff;border:4px solid var(--navy);color:var(--navy);min-height:150px}.grade:hover{background:#fff7f0;border-color:var(--orange)}
.mode-vocab{border-top:8px solid #ff9f1c}.mode-memory{border-top:8px solid #7b61ff}.mode-speak{border-top:8px solid #18a558}
.unit{background:#fff;min-height:120px;border-radius:20px;padding:18px;text-align:left;box-shadow:0 6px 22px #00000010}.unit strong{display:block;font-size:20px;color:var(--navy);margin-bottom:7px}.unit span{font-size:14px;color:#667}
.wordcard{text-align:center;background:#fff;border-radius:28px;padding:25px;box-shadow:0 10px 30px #0002}.pic{height:220px;border-radius:22px;background:#eef2ff;display:flex;align-items:center;justify-content:center;font-size:110px;margin-bottom:20px}.word{font-size:42px;font-weight:900;color:var(--navy);cursor:pointer}.ipa{font-size:23px;color:#7b61ff;margin:8px}.meaning{font-size:23px}.progress{height:10px;background:#ddd;border-radius:99px;overflow:hidden;margin:15px 0}.progress i{display:block;height:100%;background:var(--orange);width:0}
.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:18px}.quiz{text-align:center}.quiz .pic{height:240px}.options{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}.option{background:#fff;border:3px solid #dde3ee;border-radius:18px;padding:18px;font-size:22px;font-weight:800;min-height:75px}.option.correct{background:#d9f7e5;border-color:var(--green)}.option.wrong{background:#ffe0e0;border-color:var(--red)}
.question{font-size:30px;font-weight:900;color:var(--navy);margin:14px}.timer{font-size:18px;font-weight:800;color:var(--orange);min-height:25px}
.speak-card{background:#fff;border-radius:24px;padding:28px;text-align:center;box-shadow:0 8px 25px #0001}.q{font-size:30px;font-weight:900}.answer{font-size:23px;color:var(--green);margin:18px}.hidden{display:none!important}
@media(max-width:650px){.screen{padding:15px}.options{grid-template-columns:1fr}.pic{height:180px}.word{font-size:34px}.question,.q{font-size:24px}}
</style>
</head>
<body>

<section id="welcome" class="screen welcome active">
 <div><h1 class="pulse">WELCOME TO HENRY ENGLISH CLASS</h1><p>Learn • Listen • Speak • Remember</p><button class="btn orange" onclick="go('language')">START / BẮT ĐẦU</button></div>
</section>

<section id="language" class="screen"><div class="wrap">
 <div class="hero"><h2 id="langTitle">Choose your language</h2><p id="langSub">Chọn ngôn ngữ cho hệ thống</p></div>
 <div class="grid">
  <button class="card choice" onclick="setLang('vi')">🇻🇳<br>TIẾNG VIỆT</button>
  <button class="card choice" onclick="setLang('en')">🇬🇧<br>ENGLISH</button>
 </div>
</div></section>

<section id="grades" class="screen"><div class="wrap">
 <div class="top"><div class="logo">HENRY ENGLISH CLASS</div><button class="btn light" onclick="go('language')">🌐</button></div>
 <div class="hero"><h2 id="gradeTitle"></h2><p id="gradeSub"></p></div>
 <div class="grid">
  <button class="card choice grade" onclick="selectGrade(1)">📘<br><span id="g1">LỚP 1</span></button>
  <button class="card choice grade" onclick="selectGrade(3)">📗<br><span id="g3">LỚP 3</span></button>
 </div>
</div></section>

<section id="modes" class="screen"><div class="wrap">
 <div class="top"><div class="logo">HENRY ENGLISH CLASS</div><button class="btn light" onclick="go('grades')">←</button></div>
 <div class="hero"><h2 id="modeTitle"></h2><p id="modeSub"></p></div>
 <div class="grid">
  <button class="card choice mode-vocab" onclick="showUnits('vocab')">📚<br><span id="mv"></span></button>
  <button class="card choice mode-memory" onclick="showMemory()">🧠<br><span id="mm"></span></button>
  <button class="card choice mode-speak" onclick="showUnits('speak')">🗣️<br><span id="ms"></span></button>
 </div>
</div></section>

<section id="units" class="screen"><div class="wrap">
 <div class="top"><div class="logo" id="unitsLogo"></div><button class="btn light" onclick="go('modes')">←</button></div>
 <div class="hero"><h2 id="unitsTitle"></h2><p id="unitsSub"></p></div>
 <div id="unitGrid" class="grid"></div>
</div></section>

<section id="memory" class="screen"><div class="wrap">
 <div class="top"><div class="logo">🧠 <span id="memoryTop"></span></div><button class="btn light" onclick="go('modes')">←</button></div>
 <div class="grid" id="memoryGrid"></div>
</div></section>

<section id="learn" class="screen"><div class="wrap">
 <div class="top"><div class="logo" id="learnTitle"></div><button class="btn light" onclick="stopSession();go('units')">←</button></div>
 <div class="wordcard">
  <div class="progress"><i id="bar"></i></div>
  <div id="pic" class="pic">📘</div>
  <div id="word" class="word" onclick="speakCurrent()"></div>
  <div id="ipa" class="ipa"></div><div id="meaning" class="meaning"></div>
  <div class="actions"><button class="btn" onclick="speakCurrent()">🔊 SPEAK</button><button class="btn orange" onclick="skipCurrent()">⏭️ SKIP</button><button class="btn light" onclick="stopSession();go('units')">EXIT</button></div>
  <p class="small" id="learnHint"></p>
 </div>
</div></section>

<section id="quiz" class="screen"><div class="wrap">
 <div class="top"><div class="logo" id="quizTitle"></div><button class="btn light" onclick="stopSession();go('units')">←</button></div>
 <div class="card quiz">
  <div class="progress"><i id="qbar"></i></div>
  <div id="qpic" class="pic">🖼️</div>
  <div id="question" class="question"></div><div id="timer" class="timer"></div>
  <div id="options" class="options"></div>
  <div class="actions"><button class="btn light" onclick="stopSession();go('units')">EXIT</button></div>
 </div>
</div></section>

const T={
 vi:{choose:"Chọn ngôn ngữ",sub:"Chọn ngôn ngữ cho hệ thống",grade:"Chọn lớp",gradeSub:"Chọn lớp để bắt đầu học",vocab:"TỪ VỰNG",memory:"GHI NHỚ",speak:"LUYỆN NÓI",unit:"Chọn Unit",pair:"Chọn nhóm Unit",repeat:"Bạn lặp lại nhé!",skip:"Bỏ qua",exit:"Thoát",correct:"Đúng!",wrong:"Sai!",answer:"Đáp án đúng",listen:"Nghe",speakTitle:"Luyện nói",question:"Câu hỏi",ready:"Chuẩn bị...",time:"Trả lời trong",finish:"Hoàn thành!"},
 en:{choose:"Choose your language",sub:"Choose the system language",grade:"Choose a grade",gradeSub:"Choose a grade to start learning",vocab:"VOCABULARY",memory:"MEMORY",speak:"SPEAKING",unit:"Choose a Unit",pair:"Choose a Unit pair",repeat:"Please repeat!",skip:"Skip",exit:"Exit",correct:"Correct!",wrong:"Try again!",answer:"Correct answer",listen:"Listen",speakTitle:"Speaking Practice",question:"Question",ready:"Get ready...",time:"Answer in",finish:"Finished!"}
};
let lang="vi", grade=1, mode="vocab", session=[], idx=0, timerId=null, stopped=false, currentQuiz=null;

function go(id){document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));document.getElementById(id).classList.add("active"); clickSound();}
function setLang(l){lang=l; render(); go("grades"); welcomeSound();}
function selectGrade(g){grade=g; render();go("modes")}
function render(){
 const t=T[lang];
 document.getElementById("langTitle").textContent=t.choose;document.getElementById("langSub").textContent=t.sub;
 document.getElementById("gradeTitle").textContent=t.grade;document.getElementById("gradeSub").textContent=t.gradeSub;
 document.getElementById("modeTitle").textContent=grade===1?"GLOBAL SUCCESS 1":"GLOBAL SUCCESS 3";
 document.getElementById("modeSub").textContent=t.gradeSub;
 document.getElementById("mv").textContent=t.vocab;document.getElementById("mm").textContent=t.memory;document.getElementById("ms").textContent=t.speak;
}
function unitsForGrade(){return VOCAB.filter(x=>x.grade===grade)}
function pairs(){return grade===1?PAIRS1:PAIRS3}
function showUnits(m){
 mode=m; const t=T[lang]; go("units");
 document.getElementById("unitsLogo").textContent=grade===1?"📘 GLOBAL SUCCESS 1":"📗 GLOBAL SUCCESS 3";
 document.getElementById("unitsTitle").textContent=m==="vocab"?t.vocab:t.speak;
 document.getElementById("unitsSub").textContent=t.pair;
 const list=pairs().map(p=>({p, label:`Unit ${p[0]} + Unit ${p[1]}`}));
 document.getElementById("unitGrid").innerHTML=list.map(x=>`<button class="unit" onclick="startPair(${x.p[0]},${x.p[1]})"><strong>${x.label}</strong><span>${m==="vocab"?"📚 "+t.vocab:"🗣️ "+t.speak}</span></button>`).join("");
}
function showMemory(){
 go("memory");const t=T[lang];document.getElementById("memoryTop").textContent=t.memory;
 const items=[["pron","🔊",lang==="vi"?"Phát âm":"Pronunciation"],["write","✍️",lang==="vi"?"Chữ viết":"Writing"],["react","⚡",lang==="vi"?"Phản xạ":"Reaction"]];
 document.getElementById("memoryGrid").innerHTML=items.map(a=>`<button class="card choice" onclick="memoryMode('${a[0]}')">${a[1]}<br>${a[2]}</button>`).join("");
}
function memoryMode(kind){
 if(kind==="pron")showUnits("vocab");
 else if(kind==="write")quizByPairs("write");
 else quizByPairs("react");
}
function getWords(a,b){
 return unitsForGrade().filter(u=>u.unit===a||u.unit===b).flatMap(u=>u.words.map(w=>({...w,unit:u.unit,title:u.title})));
}
function startPair(a,b){
 session=getWords(a,b).sort(()=>Math.random()-.5);idx=0;stopped=false;
 if(mode==="vocab"){go("learn");renderWord();}else{quizStart(session,"write");}
}
function renderWord(){
 if(stopped)return;if(idx>=session.length){stopSession();alert(T[lang].finish);go("units");return}
 const w=session[idx];document.getElementById("learnTitle").textContent=`${T[lang].vocab} • Unit ${w.unit}`;
 document.getElementById("pic").textContent=imageFor(w.word);document.getElementById("word").textContent=w.word;
 document.getElementById("ipa").textContent=w.ipa;document.getElementById("meaning").textContent=w.meaning;
 document.getElementById("bar").style.width=(idx/session.length*100)+"%";
 setTimeout(()=>speakWord(w.word),250);
}
function speakCurrent(){if(session[idx])speakWord(session[idx].word)}
function skipCurrent(){clickSound();idx++;renderWord()}
function speakWord(s){if(!("speechSynthesis" in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang="en-GB";u.rate=.78;u.pitch=1.05;speechSynthesis.speak(u)}
function speakText(s){if(!("speechSynthesis" in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang=lang==="vi"?"vi-VN":"en-GB";u.rate=.82;speechSynthesis.speak(u)}
function quizStart(words,kind){
 session=[...words].sort(()=>Math.random()-.5);idx=0;stopped=false;go("quiz");nextQuiz();
}
function nextQuiz(){
 if(stopped)return;if(idx>=session.length){alert(T[lang].finish);stopSession();go("units");return}
 currentQuiz=session[idx];document.getElementById("quizTitle").textContent=kindTitle();
 const w=currentQuiz;document.getElementById("qpic").textContent=imageFor(w.word);
 document.getElementById("question").textContent=mode==="speak"?T[lang].question:w.word;
 document.getElementById("qbar").style.width=(idx/session.length*100)+"%";
 let pool=unitsForGrade().flatMap(u=>u.words).filter(x=>x.word!==w.word).sort(()=>Math.random()-.5).slice(0,2);
 let opts=[w,...pool].sort(()=>Math.random()-.5);
 document.getElementById("options").innerHTML=opts.map((x,i)=>`<button class="option" onclick="answerQuiz(this,'${esc(x.word)}','${esc(w.word)}')">${mode==="speak"?x.word:imageFor(x.word)+" "+x.word}</button>`).join("");
 document.getElementById("timer").textContent=T[lang].time+" 4s";
 clearInterval(timerId);let left=4;timerId=setInterval(()=>{left--;document.getElementById("timer").textContent=T[lang].time+" "+left+"s";if(left<=0){clearInterval(timerId);revealCorrect(w.word)}},1000);
 speakText(mode==="speak"?makeQuestion(w):w.word);
}
function answerQuiz(btn,chosen,correct){
 clearInterval(timerId);document.querySelectorAll(".option").forEach(b=>b.disabled=true);
 if(chosen===correct){btn.classList.add("correct");clickSound(true);speakWord(correct);setTimeout(()=>{idx++;nextQuiz()},850)}
 else{btn.classList.add("wrong");clickSound(false);speakWord(correct);document.getElementById("timer").textContent=T[lang].answer+": "+correct;setTimeout(()=>{idx++;nextQuiz()},1200)}
}
function revealCorrect(correct){document.querySelectorAll(".option").forEach(b=>{if(b.textContent.includes(correct))b.classList.add("correct");b.disabled=true});speakWord(correct);setTimeout(()=>{idx++;nextQuiz()},1200)}
function makeQuestion(w){return lang==="vi"?"Hãy chọn từ đúng.":"Choose the correct word."}
function kindTitle(){return mode==="vocab"?T[lang].vocab:mode==="speak"?T[lang].speakTitle:T[lang].memory}
function esc(s){return String(s).replace(/'/g,"\\'")}
function imageFor(word){return emojiMap[word.toLowerCase()]||emojiMap[word]||"🖼️"}

let speakList=[], speakIdx=0;
function showSpeakingPair(a,b){
 speakList=[...(grade===1?SPEAK1:SPEAK3)][a]||[];
}
function startSpeaking(a,b){
 const src=grade===1?SPEAK1:SPEAK3;
 let arr=[];[a,b].forEach(n=>{(src[n]||[]).forEach(x=>arr.push({q:x[0],a:x[1]}))});
 arr=arr.sort(()=>Math.random()-.5);
 // Repeat to make a classroom-friendly 15-question round.
 while(arr.length<15)arr.push(arr[arr.length%Math.max(1,arr.length)]);
 arr=arr.slice(0,15);speakList=arr;speakIdx=0;go("quiz");nextSpeaking();
}
function nextSpeaking(){
 if(speakIdx>=speakList.length){alert(T[lang].finish);go("units");return}
 const x=speakList[speakIdx];document.getElementById("quizTitle").textContent=T[lang].speakTitle;
 document.getElementById("qpic").textContent="🗣️";document.getElementById("question").textContent=x.q;
 document.getElementById("qbar").style.width=(speakIdx/speakList.length*100)+"%";
 document.getElementById("options").innerHTML=`<div class="speak-card" style="grid-column:1/-1"><div class="timer" id="sTimer">${T[lang].time} 4s</div><div class="answer hidden" id="sAns">${x.a}</div><button class="btn orange" onclick="showSpeakingAnswer()">🔊 ${T[lang].answer}</button></div>`;
 speakText(x.q);let left=4;clearInterval(timerId);timerId=setInterval(()=>{left--;document.getElementById("sTimer").textContent=T[lang].time+" "+left+"s";if(left<=0){clearInterval(timerId);showSpeakingAnswer()}},1000)
}
function showSpeakingAnswer(){clearInterval(timerId);let a=document.getElementById("sAns");a.classList.remove("hidden");speakText(speakList[speakIdx].a);setTimeout(()=>{speakIdx++;nextSpeaking()},2200)}
function quizByPairs(kind){
 mode=kind==="react"?"react":"write";showUnits("vocab"); // unit picker remains consistent
 const old=window.startPair;window.startPair=(a,b)=>{if(kind==="write"){session=getWords(a,b).sort(()=>Math.random()-.5);quizStart(session,"write")}else{mode="react";session=getWords(a,b).sort(()=>Math.random()-.5);quizStart(session,"react")}};
}
function startPair(a,b){if(mode==="speak"){startSpeaking(a,b);return}session=getWords(a,b).sort(()=>Math.random()-.5);idx=0;stopped=false;if(mode==="vocab"){go("learn");renderWord()}else quizStart(session,mode)}
function stopSession(){stopped=true;clearInterval(timerId);if("speechSynthesis"in window)speechSynthesis.cancel()}
function clickSound(correct=true){
 try{let c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.frequency.value=correct?660:220;o.type="sine";g.gain.setValueAtTime(.001,c.currentTime);g.gain.exponentialRampToValueAtTime(.08,c.currentTime+.01);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.16);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.18)}catch(e){}
}
function welcomeSound(){try{let c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.type="triangle";o.frequency.setValueAtTime(440,c.currentTime);o.frequency.exponentialRampToValueAtTime(880,c.currentTime+.5);g.gain.setValueAtTime(.001,c.currentTime);g.gain.exponentialRampToValueAtTime(.12,c.currentTime+.03);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.65);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.7)}catch(e){}}
render();
</script>

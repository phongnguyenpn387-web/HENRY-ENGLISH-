Object.assign(base,{skipping,pot:shape('<path d="M36 41H17v24h19m88-24h19v24h-19" fill="none"/><path d="M34 32h92v48c0 27-92 27-92 0z" fill="#85c1c7"/><path d="M29 33h102M66 24v-7h28v7" fill="none"/>'),'pencil case':pencilCase});
add('skip rope',skipping);add('my pencil case',pencilCase);add('a doll',doll);
const age=shape('<rect x="23" y="19" width="114" height="91" rx="12" fill="#f8e2a8"/><path d="M23 43h114M47 9v22m65-22v22" fill="none"/><text x="80" y="87" text-anchor="middle" font-family="Arial" font-size="34" fill="#545897" stroke="none">6 → 8</text>');
const wornBook=shape('<path d="M40 17l72 4 4 82-72-3-7-15 5-10-5-17z" fill="#bc9c73"/><path d="M49 23l3 70m18-39 15 10-14 12m23-50-7 16" fill="none"/>');
function render(word,unit,group,grade=3){const k=normal(word);if(k==='old')return Number(unit)===2?age:wornBook;if(k==='new')return object('book','#3cbd90');if(k==='open')return Number(unit)===4?'😮':'📖';if(k==='fish'&&((grade===3&&Number(unit)===15)||(grade===1&&Number(unit)===5)))return '🍽️🐟';if(k==='red ball')return shape('<circle cx="80" cy="60" r="44" fill="#ed4f56"/><path d="M38 51q42-33 84 0M42 78q40-35 78 0" stroke="#ffbbc0" fill="none"/>');if(k==='red bell')return shape('<path d="M46 76h68l-12-17V41c0-30-44-30-44 0v18z" fill="#eb5059"/><path d="M67 87q13 21 26 0" fill="#e9bc56"/>');if(k==='english book')return object('book','#db797a');return P[k]||base[k]||'💬'}
return {render,has:(word)=>!!(P[normal(word)]||base[normal(word)]),object};

function symbol(word,unit){return HenryArt.render(word,unit??items[pos]?.unit,section,3)}
function studyHTML(){const x=items[pos];return `<div class="panel study">${progress()}<div class="illustration">${symbol(x.en,x.unit)}</div><div class="study-word">${esc(x.en)}</div><div class="ipa">${esc(x.ipa)}</div><div class="meaning">${lang==='vi'?esc(x.vi):''}</div><div class="row">${btn('🔊 '+txt('Nghe phát âm','Listen'),"say(items[pos].en)",'primary')}</div><div class="row" style="margin-top:20px">${btn(txt('← Trước','← Back'),'move(-1)','',pos===0)}${btn(pos===items.length-1?txt('Hoàn thành ✓','Finish ✓'):txt('Tiếp theo →','Next →'),'move(1)','orange')}</div></div>`}
function move(d){stop();pos+=d;if(pos>=items.length){go('finish');return}if(kind==='speak')startSpeaking();else if(kind==='practice')startExercise();else render()}
function restart(){pos=0;score=0;if(kind==='speak')startSpeaking();else if(kind==='practice')startExercise();else go('study')}
function startPractice(m){mode=m;pos=0;score=0;startExercise()}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function countdown(done,duration=4){seconds=duration;phase='countdown';render();interval=setInterval(()=>{seconds--;sound(seconds?660:920,.07);if(seconds<=0){clearInterval(interval);interval=null;done()}else{const e=$('clock');if(e)e.textContent=seconds}},1000)}
function isChoice(){return ['wordPicture','pictureWord'].includes(mode)}
function clue(x){return `<div class="picture-cue"><span>${symbol(x.en,x.unit)}</span><small>${esc(x.vi)}</small></div>`}
function startExercise(){stop();if(pos>=items.length){go('finish');return}route='exercise';phase='ready';answered=false;choiceIndex=-1;readCount=0;const x=items[pos];if(isChoice()){const seen=new Set([mode==='wordPicture'?x.vi:x.en]);const pool=items.filter(y=>{const key=mode==='wordPicture'?y.vi:y.en;if(seen.has(key))return false;seen.add(key);return true});choices=shuffle([x,...shuffle(pool).slice(0,2)]);render()}else if(mode==='repeat')repeatWord();else countdown(revealPractice,5)}
function revealPractice(){clearTimeout(timeout);phase='answer';render();const t=token;say(items[pos].en,()=>{if(t===token)timeout=setTimeout(()=>move(1),900)})}
function repeatWord(){phase='listening';readCount++;render();const t=token;say(items[pos].en,()=>{if(t!==token)return;if(readCount<3)timeout=setTimeout(repeatWord,400);else countdown(revealPractice,4)})}
function practiceHTML(){const x=items[pos];let body='';if(mode==='repeat')body=`${clue(x)}<div class="study-word">${esc(x.en)}</div><div class="badge">${phase==='listening'?`🔊 ${readCount} / 3`:phase==='answer'?txt('🔊 Nghe đáp án','🔊 Listen to the answer'):txt('Đến lượt em đọc!','Your turn!')}</div>${phase==='countdown'?`<div id="clock" class="timer">${seconds}</div>`:''}`;
 if(['picturePron','wordPron'].includes(mode))body=`${mode==='picturePron'?clue(x):`<div class="study-word">${esc(x.en)}</div>`}<p class="muted">${txt('Em hãy tự đọc bằng tiếng Anh.','Say it aloud in English.')}</p>${phase==='countdown'?`<div id="clock" class="timer">${seconds}</div>`:`<div class="answer"><strong>🔊 ${esc(x.en)}</strong><span>${esc(x.ipa)}</span></div>`}`;
 if(isChoice())body=`${mode==='wordPicture'?`<div class="study-word">${esc(x.en)}</div>`:clue(x)}<div class="choices">${choices.map((c,i)=>`<button class="choice ${answered?(c.en===x.en?'correct':i===choiceIndex?'wrong':''):''}" onclick="answerChoice(${i})" ${answered?'disabled':''}>${mode==='wordPicture'?clue(c):esc(c.en)}</button>`).join('')}</div><div class="feedback">${answered?(choices[choiceIndex].en===x.en?txt('✓ Chính xác!','✓ Correct!'):txt('Đáp án đúng: ','Correct answer: ')+esc(x.en)):''}</div>`;
 return `<div class="panel study">${progress()}${body}<div class="row" style="margin-top:12px">${btn(txt('↻ Làm lại mục này','↻ Try this item again'),'startExercise()','',isChoice()&&answered)}${phase==='answer'&&!isChoice()?btn(txt('🔊 Nghe lại','🔊 Replay'),'revealPractice()'):''}</div></div>`}
function answerChoice(i){if(answered)return;answered=true;choiceIndex=i;if(choices[i].en===items[pos].en){score++;sound(920,.15)}else sound(200,.15);phase='answer';render();const t=token;say(items[pos].en,()=>{if(t===token)timeout=setTimeout(()=>move(1),900)})}
function startSpeaking(){stop();route='speaking';phase='question';seconds=4;render();const t=token;say(items[pos].en,()=>{if(t!==token)return;countdown(()=>{phase='answer';render();say(items[pos].answer)})})}
function speakingHTML(){const x=items[pos];return `<div class="panel study">${progress()}<div class="eyebrow">${txt('LUYỆN PHẢN XẠ','SPEAKING REFLEX')}</div><div class="question"><small style="font-size:13px;color:#898da4">English</small><br>${esc(x.en)}</div><div class="translation"><small>Vietnamese</small><br>${esc(x.vi)}</div>${phase==='answer'?`<div class="answer"><small>${txt('Đáp án mẫu','Model answer')}</small><strong>${esc(x.answer)}</strong>${lang==='vi'?`<p>${esc(x.answerVi)}</p>`:''}</div>`:`<p class="muted">${phase==='question'?txt('Nghe câu hỏi…','Listen to the question…'):txt('Em hãy tự trả lời trong 4 giây.','Answer the question in 4 seconds.')}</p><div class="timer" id="clock">${phase==='question'?'🔊':seconds}</div>`}<div class="row">${btn(txt('← Trước','← Back'),'move(-1)','',pos===0)}${btn('🔊 '+txt('Câu hỏi','Question'),"replayQuestion()")}${btn('🔊 '+txt('Đáp án','Answer'),"say(items[pos].answer)",'',phase!=='answer')}${btn(txt('Tiếp theo →','Next →'),'move(1)','orange',phase!=='answer')}</div></div>`}
function replayQuestion(){if(phase==='answer')say(items[pos].en);else startSpeaking()}
render();
</script></body></html>


<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Henry English App</title>
<style>
:root{
  --navy:#000055; --orange:#FF6600; --green:#16a34a; --red:#dc2626;
  --bg:#f5f7fb; --card:#fff; --text:#172033; --muted:#667085;
}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
button{font:inherit;border:0;cursor:pointer}
.screen{display:none;min-height:100vh}
.screen.active{display:block}
.welcome{background:var(--navy);color:white;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px}
.welcome-box{max-width:800px}
.welcome h1{color:var(--orange);font-size:clamp(30px,6vw,62px);margin:0 0 18px;font-weight:900}
.welcome p{font-size:20px;margin:0 0 30px}
.primary{background:var(--orange);color:#fff;border-radius:16px;padding:15px 26px;font-weight:800}
.lang-row,.grade-row,.menu-grid,.group-grid{display:grid;gap:18px}
.lang-row{grid-template-columns:repeat(2,minmax(140px,260px));justify-content:center}
.lang-btn,.grade-btn{background:#fff;color:var(--navy);border-radius:20px;padding:22px;font-weight:900;box-shadow:0 8px 25px #0002}
.app{padding:20px;max-width:1100px;margin:auto}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}
.logo{font-weight:900;color:var(--orange);font-size:24px}
.small-btn{background:#fff;padding:10px 14px;border-radius:12px;color:var(--navy);font-weight:800}
.menu-grid{grid-template-columns:repeat(3,1fr);margin-top:30px}
.menu-card{min-height:150px;border-radius:24px;color:white;padding:25px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;box-shadow:0 10px 28px #0002}
.menu-card:nth-child(1){background:#2563eb}.menu-card:nth-child(2){background:#9333ea}.menu-card:nth-child(3){background:#0f766e}
.menu-card h2{margin:0 0 8px;font-size:28px}.menu-card p{margin:0;opacity:.9}
.section-title{text-align:center;margin:15px 0 25px}
.section-title h1{margin:0;font-size:34px}.section-title p{color:var(--muted)}
.group-grid{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.group-btn{background:#fff;border-radius:18px;padding:18px;text-align:left;box-shadow:0 5px 18px #0001;font-weight:800;color:var(--navy)}
.group-btn span{display:block;color:var(--muted);font-size:13px;margin-top:6px}
.vocab-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.vocab-card{background:#fff;border-radius:18px;padding:18px;box-shadow:0 5px 18px #0001;text-align:center}
.vocab-img{height:130px;border-radius:14px;background:#eef3ff;display:flex;align-items:center;justify-content:center;font-size:72px;margin-bottom:12px}
.word{font-size:28px;font-weight:900}.ipa{color:var(--orange);margin:6px 0}.meaning{color:var(--muted)}
.listen{margin-top:10px;background:var(--navy);color:white;border-radius:10px;padding:8px 12px}
.practice{max-width:760px;margin:auto;background:#fff;border-radius:24px;padding:24px;box-shadow:0 8px 30px #0001;text-align:center}
.practice-image{font-size:120px;height:210px;display:flex;align-items:center;justify-content:center;background:#f1f5f9;border-radius:20px}
.practice-word{font-size:40px;font-weight:900;margin:18px 0 6px}.practice-ipa{color:var(--orange);font-size:20px}
.controls{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:20px}
.controls button{padding:12px 18px;border-radius:12px;font-weight:800;background:#e8edf7;color:var(--navy)}
.controls .skip{background:#f59e0b;color:white}
.quiz-options{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}
.option{background:#f1f5f9;border:3px solid transparent;border-radius:16px;padding:15px;min-height:65px;font-weight:900}
.option.correct{background:#dcfce7;border-color:var(--green);color:#166534}
.option.wrong{background:#fee2e2;border-color:var(--red);color:#991b1b}
.progress{height:10px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin:18px 0}
.progress i{display:block;height:100%;background:var(--orange);width:0}
.question{font-size:30px;font-weight:900;margin:18px 0}
.answer{font-size:22px;color:var(--green);font-weight:800;min-height:30px}
.score{font-size:22px;font-weight:900;color:var(--navy);margin-top:14px}
.hidden{display:none!important}
@media(max-width:700px){
 .menu-grid{grid-template-columns:1fr}.quiz-options{grid-template-columns:1fr}
 .app{padding:14px}.practice{padding:15px}.practice-image{height:170px}
}
</style>
</head>
<body>

<div id="welcome" class="screen active welcome">
  <div class="welcome-box">
    <h1>WELCOME TO HENRY ENGLISH CLASS</h1>
    <p>Learn • Remember • Speak</p>
    <button class="primary" onclick="goLanguage()">START</button>
  </div>
</div>

<div id="language" class="screen welcome">
  <div class="welcome-box">
    <h1>CHOOSE LANGUAGE</h1>
    <div class="lang-row">
      <button class="lang-btn" onclick="setLanguage('vi')">TIẾNG VIỆT</button>
      <button class="lang-btn" onclick="setLanguage('en')">ENGLISH</button>
    </div>
  </div>
</div>

<div id="grade" class="screen">
  <div class="app">
    <div class="topbar"><div class="logo">HENRY ENGLISH</div><button class="small-btn" onclick="show('language')">🌐</button></div>
    <div class="section-title"><h1 id="gradeTitle">Chọn lớp</h1><p id="gradeSub">Chọn lớp để bắt đầu</p></div>
    <div class="grade-row" style="grid-template-columns:repeat(2,1fr);max-width:700px;margin:auto">
      <button class="grade-btn" onclick="chooseGrade(1)">📚 LỚP 1</button>
      <button class="grade-btn" onclick="chooseGrade(3)">📚 LỚP 3</button>
    </div>
  </div>
</div>

<div id="home" class="screen">
  <div class="app">
    <div class="topbar">
      <div class="logo">HENRY ENGLISH</div>
      <button class="small-btn" onclick="show('grade')">↩ <span data-t="back">Lớp</span></button>
    </div>
    <div class="section-title"><h1 id="homeTitle"></h1><p id="homeSub"></p></div>
    <div class="menu-grid">
      <button class="menu-card" onclick="openVocabulary()"><h2>📖 <span data-t="vocab">Từ vựng</span></h2><p>Vocabulary</p></button>
      <button class="menu-card" onclick="openMemory()"><h2>🧠 <span data-t="memory">Ghi nhớ</span></h2><p>Remember</p></button>
      <button class="menu-card" onclick="openSpeaking()"><h2>🗣️ <span data-t="speaking">Luyện nói</span></h2><p>Speaking</p></button>
    </div>
  </div>
</div>

<div id="content" class="screen">
  <div class="app">
    <div class="topbar"><div class="logo">HENRY ENGLISH</div><button class="small-btn" onclick="show('home')">↩ <span data-t="home">Trang chủ</span></button></div>
    <div id="contentArea"></div>
  </div>
</div>

["Unit 18","PLAYING AND DOING",[["dancing","/ˈdɑːnsɪŋ/","nhảy múa","💃"],["drawing a picture","/ˈdrɔːɪŋ ə ˈpɪktʃə(r)/","vẽ tranh","🎨"],["listening to music","/ˈlɪsənɪŋ tə ˈmjuːzɪk/","nghe nhạc","🎧"],["reading","/ˈriːdɪŋ/","đọc sách","📖"],["singing","/ˈsɪŋɪŋ/","hát","🎤"],["watching TV","/ˈwɒtʃɪŋ ˌtiː ˈviː/","xem TV","📺"],["writing","/ˈraɪtɪŋ/","viết","✍️"]]],

["Unit 20","AT THE ZOO",[["zoo","/zuː/","sở thú","🦁"],["animal","/ˈænɪməl/","động vật","🐾"],["elephant","/ˈelɪfənt/","con voi","🐘"],["horse","/hɔːs/","con ngựa","🐴"],["monkey","/ˈmʌŋki/","con khỉ","🐒"],["peacock","/ˈpiːkɒk/","con công","🦚"],["tiger","/ˈtaɪɡə(r)/","con hổ","🐯"],["count","/kaʊnt/","đếm","🔢"],["climb","/klaɪm/","trèo, leo","🧗"],["swing","/swɪŋ/","đung đưa","🛝"]]]
];

const s1=[
["Unit 1 + 2",["Hi, I’m Bill.","What do you have?","I have a car.","How are you?"]],
["Unit 3 + 4",["What is this?","This is my bag.","This is a dog."]],
["Unit 5 + 6",["I like milk.","Do you like milk?","What colour is it?","It’s a red pen."]],
["Unit 7 + 8",["What’s there?","There’s a garden.","Touch your hair."]],
["Unit 9 + 10",["How many clocks?","Two clocks.","What’s that?","That’s a monkey."]],
["Unit 11 + 12",["What is he doing?","He’s running.","What can you see?","I can see lemons."]],
["Unit 13 + 14",["What is she having?","She’s having noodles.","Can you see a tiger?","Yes, I can. / No, I can’t."]]
];
const s3=[
["Unit 1 + 2",["How are you?","What’s your name?","How do you spell your name?"]],
["Unit 3 + 4",["Who’s that?","Is he your friend?","What’s this?","What are these?"]],
["Unit 5 + 6",["What’s your hobby?","Do you like dancing?","What’s the name of your school?","Where is your school?"]],
["Unit 7 + 8",["What do you do?","Can you speak?","What’s this?","Do you have a pencil?"]],
["Unit 9 + 10",["What colour is it?","What colour are they?","What do you do at break time?","Do you play football?"]],
["Unit 11 + 12",["Who’s this?","How old is he?","What’s his job?","Is he a doctor?"]],
["Unit 13 + 14",["Where is the bedroom?","Where are the books?","What’s in your bedroom?","What are in your bedroom?"]],
["Unit 15 + 16",["Would you like milk?","What would you like?","Do you have a dog?","How many pets do you have?"]],
["Unit 17 + 18",["What does he have?","Does he have a car?","What are you doing?","What is she doing?"]],
["Unit 19 + 20",["What is he doing?","Are you cycling?","What can you see?","What is the tiger doing?"]]
];

const memGroups1=["Unit 1 + 2","Unit 3 + 4","Unit 5 + 6","Unit 7 + 8","Unit 9 + 10","Unit 11 + 12","Unit 13 + 14"];
const memGroups3=["Unit 1 + 2","Unit 3 + 4","Unit 5 + 6","Unit 7 + 8","Unit 9 + 10","Unit 11 + 12","Unit 13 + 14","Unit 15 + 16","Unit 17 + 18","Unit 19 + 20"];

function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');}
function goLanguage(){show('language')}
function setLanguage(x){lang=x; updateText(); show('grade')}
function updateText(){
 document.querySelectorAll('[data-t]').forEach(e=>e.textContent=T[lang][e.dataset.t]||e.textContent);
 document.getElementById('gradeTitle').textContent=lang==='vi'?'Chọn lớp':'Choose a grade';
 document.getElementById('gradeSub').textContent=lang==='vi'?'Chọn lớp để bắt đầu':'Choose a grade to start';
}
function chooseGrade(g){grade=g;document.getElementById('homeTitle').textContent=(lang==='vi'?'LỚP ':'GRADE ')+g;document.getElementById('homeSub').textContent=lang==='vi'?'Chọn nội dung bạn muốn học':'Choose what you want to practise';show('home')}
function data(){return grade===1?g1:g3}
function groupUnits(label){
 let nums=label.match(/\d+/g).map(Number); return nums.map(n=>data()[n-1]).filter(Boolean).flatMap(u=>u[2].map(x=>({...x,unit:u[0]})));
}
function title(text,sub=''){return `<div class="section-title"><h1>${text}</h1><p>${sub}</p></div>`}
function openVocabulary(){
 currentMode='vocab';
 document.getElementById('contentArea').innerHTML=title(T[lang].chooseUnit,'Vocabulary')+
 `<div class="group-grid">${data().map((u,i)=>`<button class="group-btn" onclick="showVocabUnit(${i})">${u[0]}<span>${u[1]}</span></button>`).join('')}</div>`;
 show('content')
}
function showVocabUnit(i){
 let u=data()[i];
 document.getElementById('contentArea').innerHTML=title(u[0],u[1])+
 `<div class="vocab-list">${u[2].map(w=>`<div class="vocab-card"><div class="vocab-img">${w[3]}</div><div class="word">${w[0]}</div><div class="ipa">${w[1]}</div><div class="meaning">${w[2]}</div><button class="listen" onclick="speak('${w[0].replace(/'/g,"\\'")}')">🔊 ${T[lang].listen}</button></div>`).join('')}</div>`+
 `<div class="controls"><button onclick="openVocabulary()">↩ ${T[lang].backList}</button></div>`;
}
function openMemory(){
 currentMode='memory';
 document.getElementById('contentArea').innerHTML=title(T[lang].memory,'Choose a practice mode')+
 `<div class="menu-grid">
 <button class="menu-card" onclick="memoryGroups('pronounce')"><h2>🔊 ${T[lang].pronounce}</h2><p>Listen and repeat</p></button>
 <button class="menu-card" onclick="memoryGroups('write')"><h2>✏️ ${T[lang].write}</h2><p>Word → picture</p></button>
 <button class="menu-card" onclick="memoryGroups('reflex')"><h2>⚡ ${T[lang].reflex}</h2><p>Picture → word</p></button></div>`;
 show('content')
}
function memoryGroups(mode){
 currentMode=mode;
 let gs=grade===1?memGroups1:memGroups3;
 document.getElementById('contentArea').innerHTML=title(T[lang][mode],mode==='pronounce'?'Listen and repeat':'Quiz')+
 `<div class="group-grid">${gs.map((g,i)=>`<button class="group-btn" onclick="startMemory('${mode}',${i})">${g}<span>${grade===1?'Units '+(i*2+1)+' + '+(i*2+2):'Units '+(i*2+1)+' + '+(i*2+2)}</span></button>`).join('')}</div>`;
}
function startMemory(mode,i){
 currentMode=mode; currentGroup=i; quizScore=0; quizIndex=0;
 if(mode==='pronounce'){runPronounce(i);return}
 quizItems=shuffle(groupUnits((grade===1?memGroups1:memGroups3)[i])).map(x=>({...x}));
 runMemoryQuiz();
}
function runPronounce(i){
 let gs=grade===1?memGroups1:memGroups3, items=groupUnits(gs[i]);
 let idx=0;
 function next(){
   if(!document.getElementById('content').classList.contains('active')){clearTimeout(timer);return}
   if(idx>=items.length){document.getElementById('contentArea').innerHTML=title(T[lang].pronounce,'Hoàn thành 🎉')+`<div class="practice"><div class="score">${T[lang].score}: ${items.length}/${items.length}</div><div class="controls"><button onclick="memoryGroups('pronounce')">↩ ${T[lang].backList}</button></div></div>`;return}
   let w=items[idx];
   document.getElementById('contentArea').innerHTML=title(gs[i],T[lang].repeat)+
   `<div class="practice"><div class="progress"><i style="width:${idx/items.length*100}%"></i></div><div class="practice-image">${w[3]}</div><div class="practice-word">${w[0]}</div><div class="practice-ipa">${w[1]}</div><div class="answer">${T[lang].repeat}</div><div class="controls"><button class="skip" onclick="idx++;clearTimeout(timer);next()">⏭ ${T[lang].skip}</button><button onclick="speak('${w[0].replace(/'/g,"\\'")}')">🔊 ${T[lang].listen}</button><button onclick="clearTimeout(timer);idx++;next()">▶ ${T[lang].next}</button></div></div>`;
   let count=0;
   const say=()=>{ if(count<3){speak(w[0]);count++;setTimeout(say,1300)}else{setTimeout(()=>speak(T[lang].repeat),400);timer=setTimeout(()=>{idx++;next()},4000)} };
   say();
 }
 next();
}
function runMemoryQuiz(){
 if(quizIndex>=quizItems.length){document.getElementById('contentArea').innerHTML=title(T[lang][currentMode],'🎉')+`<div class="practice"><div class="score">${T[lang].score}: ${quizScore}/${quizItems.length}</div><div class="controls"><button onclick="memoryGroups('${currentMode}')">↩ ${T[lang].backList}</button></div></div>`;return}
 let w=quizItems[quizIndex], opts=makeOptions(w,quizItems);
 let question=currentMode==='write'?w[0]:w[3];
 let content=currentMode==='write'
 ? `<div class="question">${question}</div><div class="quiz-options">${opts.map(o=>`<button class="option" onclick="answerMemory(this,'${o[0].replace(/'/g,"\\'")}','${w[0].replace(/'/g,"\\'")}')">${o[3]}</button>`).join('')}</div>`
 : `<div class="practice-image">${w[3]}</div><div class="quiz-options">${opts.map(o=>`<button class="option" onclick="answerMemory(this,'${o[0].replace(/'/g,"\\'")}','${w[0].replace(/'/g,"\\'")}')">${o[0]}</button>`).join('')}</div>`;
 document.getElementById('contentArea').innerHTML=title((grade===1?memGroups1:memGroups3)[currentGroup],T[lang][currentMode])+
 `<div class="practice"><div class="progress"><i style="width:${quizIndex/quizItems.length*100}%"></i></div>${content}<div class="answer" id="feedback"></div></div>`;
}
function answerMemory(btn,picked,correct){
 document.querySelectorAll('.option').forEach(b=>b.disabled=true);
 if(picked===correct){btn.classList.add('correct');quizScore++;feedback.textContent=T[lang].correct;sound(true);speak(correct)}
 else{btn.classList.add('wrong');feedback.textContent=T[lang].wrong;sound(false);speak(correct);document.querySelectorAll('.option').forEach(b=>{if(b.textContent.trim()===correct)b.classList.add('correct')})}
 setTimeout(()=>{quizIndex++;runMemoryQuiz()},1200)
}
function openSpeaking(){
 currentMode='speaking';
 let gs=grade===1?s1:s3;
 document.getElementById('contentArea').innerHTML=title(T[lang].speaking,'15 questions per group')+
 `<div class="group-grid">${gs.map((g,i)=>`<button class="group-btn" onclick="startSpeaking(${i})">${g[0]}<span>15 questions</span></button>`).join('')}</div>`;
 show('content')
}
function startSpeaking(i){
 currentGroup=i;quizIndex=0;quizScore=0;
 let gs=grade===1?s1:s3, units=gs[i][0].match(/\d+/g).map(Number);
 quizItems=makeSpeakingQuestions(units);
 runSpeaking();
}
function makeSpeakingQuestions(units){
 let pool=units.flatMap(n=>grade===1?data()[n-1][2]:data()[n-1][2]);
 let templates=(grade===1?s1:s3)[currentGroup][1];
 let arr=[];
 for(let i=0;i<15;i++){
   let w=pool[i%pool.length], t=templates[i%templates.length];
   let q=t, a='';
   if(t.includes("milk")){q="Do you like milk?";a="Yes, I do."}
   else if(t.includes("car")){q="What do you have?";a="I have a car."}
   else if(t.includes("dancing")){q="Do you like dancing?";a="Yes, I do."}
   else if(t.includes("pencil")){q="Do you have a pencil?";a="Yes, I do."}
   else if(t.includes("football")){q="Do you play football?";a="Yes, I do."}
   else if(t.includes("cycling")){q="Are you cycling?";a="Yes, I am."}
   else if(t.includes("dog")){q="Do you have a dog?";a="Yes, I do."}
   else if(t.includes("tiger")){q="What can you see?";a="I can see a tiger."}
   else if(t.startsWith("What colour")){q=t;a="It’s "+(w[0]==='red'?'red':'blue')+"."}
   else if(t.startsWith("What’s your hobby")){q=t;a="I like "+(w[0].endsWith("ing")?w[0]:"dancing")+"."}
   else if(t.startsWith("What’s your name")){q=t;a="My name’s Bill."}
   else if(t.startsWith("How are you")){q=t;a="I’m fine, thank you."}
   else if(t.startsWith("What do you do")){q=t;a="I play football."}
   else if(t.startsWith("What is he doing")){q=t;a="He’s running."}
   else if(t.startsWith("What is she doing")){q=t;a="She’s running."}
   else if(t.startsWith("What can you see")){q=t;a="I can see a "+w[0]+"."}
   else if(t.startsWith("Who’s")){q=t;a="He’s my friend."}
   else if(t.startsWith("What’s this")){q=t;a="It’s a "+w[0]+"."}
   else if(t.startsWith("Would you like")){q=t;a="Yes, please."}
   else if(t.startsWith("What would")){q=t;a="I’d like milk."}
   else if(t.startsWith("What’s his")){q=t;a="He’s a doctor."}
   else if(t.startsWith("What’s the name")){q=t;a="It’s my school."}
   else if(t.startsWith("Where is")){q=t;a="It’s here."}
   else if(t.startsWith("Where are")){q=t;a="They’re on the table."}
   else if(t.startsWith("What’s in")){q=t;a="There’s a bed."}
   else if(t.startsWith("What are in")){q=t;a="There are two books."}
   else if(t.startsWith("How do you spell")){q=t;a="B I L L."}
   else if(t.startsWith("Can you")){q=t;a="Yes, I can."}
   else if(t.startsWith("What does")){q=t;a="He has a car."}
   else if(t.startsWith("Does he")){q=t;a="Yes, he does."}
   else {a=t}
   arr.push({q,a,img:w[3]});
 }
 return shuffle(arr)
}
function runSpeaking(){
 if(quizIndex>=quizItems.length){document.getElementById('contentArea').innerHTML=title(T[lang].speaking,'🎉')+`<div class="practice"><div class="score">${T[lang].score}: ${quizScore}/${quizItems.length}</div><div class="controls"><button onclick="openSpeaking()">↩ ${T[lang].backList}</button></div></div>`;return}
 let x=quizItems[quizIndex];
 document.getElementById('contentArea').innerHTML=title((grade===1?s1:s3)[currentGroup][0],`${T[lang].question} ${quizIndex+1}/15`)+
 `<div class="practice"><div class="progress"><i style="width:${quizIndex/15*100}%"></i></div><div class="practice-image">${x.img}</div><div class="question">${x.q}</div><div class="answer" id="speakAnswer"></div><div class="controls"><button onclick="speak('${x.q.replace(/'/g,"\\'")}')">🔊 ${T[lang].listen}</button><button class="skip" onclick="nextSpeaking()">⏭ ${T[lang].skip}</button></div></div>`;
 speak(x.q);
 timer=setTimeout(()=>{document.getElementById('speakAnswer').textContent=x.a;speak(x.a);timer=setTimeout(nextSpeaking,4000)},4000);
}
function nextSpeaking(){clearTimeout(timer);quizScore++;quizIndex++;runSpeaking()}
function makeOptions(correct,items){
 let others=shuffle(items.filter(x=>x[0]!==correct[0])).slice(0,2);return shuffle([correct,...others])
}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function speak(text){if('speechSynthesis' in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang='en-GB';u.rate=.82;u.pitch=1; speechSynthesis.speak(u)}}
function sound(ok){
 try{let c=new AudioContext(),o=c.createOscillator(),g=c.createGain();o.frequency.value=ok?720:180;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.08,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.18);o.start();o.stop(c.currentTime+.18)}catch(e){}
}
updateText();
</script>

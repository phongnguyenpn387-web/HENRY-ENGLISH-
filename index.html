function enter(){beep(1);language()}function language(){document.getElementById('welcome').classList.remove('active');document.getElementById('app').classList.add('active');main.innerHTML='<div class="panel" style="max-width:700px;margin:55px auto;text-align:center"><h1 class="title">Choose your language / Chọn ngôn ngữ</h1><div class="row" style="justify-content:center"><button class="primary orange" onclick="setLang(\'vi\')">🇻🇳 Tiếng Việt</button><button class="primary" onclick="setLang(\'en\')">🇬🇧 English</button></div></div>'}function setLang(x){lang=x;home()}function home(){clearAll();brand.textContent=lang==='vi'?'HENRY ENGLISH – LỚP 1':'HENRY ENGLISH – GRADE 1';main.innerHTML='<h1 class="title">'+brand.textContent+'</h1><div class="cards"><button class="menu vocab" onclick="vocabUnits()"><div class="ico">📚</div><h2>'+t('vocab')+'</h2><p>Global Success 1</p></button><button class="menu memory" onclick="memoryMenu()"><div class="ico">🧠</div><h2>'+t('memory')+'</h2><p>'+t('pron')+' • '+t('write')+' • '+t('react')+'</p></button><button class="menu speak" onclick="speakUnits()"><div class="ico">🗣️</div><h2>'+t('speak')+'</h2><p>4-second response</p></button></div>'}
function units(selectable=true){let s='<div class="grid">';for(let i=1;i<=16;i++)if(vocabData[i])s+='<button class="unit" id="u'+i+'" onclick="'+(selectable?'toggle('+i+')':'startSpeak('+i+')')+'">UNIT '+i+'<small>'+esc(unitTitles[i]||'')+'</small></button>';return s+'</div>'}
function vocabUnits(){selected=[];main.innerHTML='<button class="back" onclick="home()">'+t('back')+'</button><div class="panel"><h2>'+t('choose')+'</h2><p class="muted">Chọn một hoặc nhiều Unit.</p>'+units(true)+'<div class="row" style="margin-top:16px"><button class="primary orange" onclick="startVocab()">'+t('start')+'</button><span id="count" class="muted">0 '+t('sel')+'</span></div></div>'}
function toggle(i){let e=document.getElementById('u'+i);if(selected.includes(i)){selected=selected.filter(x=>x!==i);e.classList.remove('sel')}else{selected.push(i);e.classList.add('sel')}document.getElementById('count').textContent=selected.length+' '+t('sel')}
function startVocab(){if(!selected.length)return;list=selected.flatMap(u=>vocabData[u].map(x=>({...x,unit:u})));idx=0;showVocab()}
function showVocab(){if(idx>=list.length){vocabUnits();return}let x=list[idx];main.innerHTML='<button class="back" onclick="vocabUnits()">'+t('back')+'</button><div class="panel wordCard"><div class="muted">UNIT '+x.unit+' • '+(idx+1)+'/'+list.length+'</div><div class="bar"><i style="width:'+((idx+1)/list.length*100)+'%"></i></div><div class="image" onclick="sayWord()"><div class="pic">'+icon(x.word)+'</div><div class="label">[IMAGE: '+esc(x.word.toUpperCase())+']</div></div><div class="word">'+esc(x.word)+'</div><div class="ipa">'+esc(x.ipa)+'</div><div class="meaning">'+esc(x.meaning)+'</div><button id="sp" class="speaker" onclick="sayWord()">🔊</button><div style="margin-top:20px"><button class="primary orange" onclick="idx++;showVocab()">'+t('nextWord')+'</button></div></div>'}
function sayWord(){let e=document.getElementById('sp');if(e)e.classList.add('play');speak(list[idx].word,.68);setTimeout(()=>e&&e.classList.remove('play'),700)}
function memoryMenu(){main.innerHTML='<button class="back" onclick="home()">'+t('back')+'</button><div class="panel"><h2>'+t('memory')+'</h2><div class="cards"><button class="menu speak" onclick="memoryUnits(\'pron\')"><div class="ico">🔊</div><h2>'+t('pron')+'</h2></button><button class="menu vocab" onclick="memoryUnits(\'write\')"><div class="ico">✍️</div><h2>'+t('write')+'</h2></button><button class="menu memory" onclick="memoryUnits(\'react\')"><div class="ico">⚡</div><h2>'+t('react')+'</h2></button></div></div>'}
function memoryUnits(m){mode=m;selected=[];main.innerHTML='<button class="back" onclick="memoryMenu()">'+t('back')+'</button><div class="panel"><h2>'+t(m)+'</h2>'+units(true)+'<div class="row" style="margin-top:16px"><button class="primary orange" onclick="startQuiz()">'+t('startQuiz')+'</button><span id="count" class="muted">0 '+t('sel')+'</span></div></div>'}
function startQuiz(){if(!selected.length)return;list=selected.flatMap(u=>vocabData[u].map(x=>({...x,unit:u})));shuffle(list);list=Array.from({length:15},(_,i)=>list[i%list.length]);idx=0;score=0;showQuiz()}
function showQuiz(){let x=list[idx],choices=shuffle([x,...wrong(x,2)]),imageMode=mode==='react';main.innerHTML='<button class="back" onclick="memoryUnits(\''+mode+'\')">'+t('back')+'</button><div class="panel"><div class="questionNo">QUESTION '+(idx+1)+'/15 • SCORE '+score+'</div><div class="quizQ">'+(imageMode?'<div class="image" style="height:250px"><div class="pic">'+icon(x.word)+'</div><div class="label">[IMAGE: '+esc(x.word.toUpperCase())+']</div></div>':esc(x.word))+'</div><div style="text-align:center" class="muted">'+(imageMode?'What is this?':'Choose the correct picture.')+'</div><div class="opts">'+choices.map(c=>'<button class="opt" onclick="quizAnswer(this,\''+attr(c.word)+'\',\''+attr(x.word)+'\')"><span class="pic">'+icon(c.word)+'</span><span>'+esc(c.word)+'</span></button>').join('')+'</div><div id="note" style="text-align:center;font-weight:900;margin:15px"></div></div>'}
function quizAnswer(btn,val,correct){if(document.querySelector('.opt[disabled]'))return;document.querySelectorAll('.opt').forEach(b=>b.disabled=true);let ok=val===correct;btn.classList.add(ok?'correct':'wrong');if(ok)score++;if(!ok)document.querySelectorAll('.opt').forEach(b=>{if(b.textContent.trim()===correct)b.classList.add('correct')});beep(ok);speak(correct,.7);note.textContent=ok?'✓ Correct!':'✗ Correct answer: '+correct;setTimeout(()=>{idx++;idx<15?showQuiz():finishQuiz()},1050)}
function finishQuiz(){main.innerHTML='<div class="panel finish"><h1>'+t('great')+'</h1><p>You completed 15 questions.</p><p>Score: '+score+'/15</p><button class="primary" onclick="startQuiz()">🔄 '+t('review')+'</button><button class="primary orange" onclick="memoryUnits(\''+mode+'\')">'+t('units')+'</button></div>'}
function wrong(x,n){let p=selected.flatMap(u=>vocabData[u]).filter(a=>a.word!==x.word);shuffle(p);return p.slice(0,n)}
function speakUnits(){main.innerHTML='<button class="back" onclick="home()">'+t('back')+'</button><div class="panel"><h2>'+t('speak')+'</h2><p class="muted">Chọn một Unit. Mỗi Unit có đúng 15 câu.</p>'+units(false)+'</div>'}
function startSpeak(u){sUnit=u;speakingIndex=0;showSpeak()}
let speakingIndex=0;function showSpeak(){clearAll();sState='question';let q=speakingData[sUnit][speakingIndex];main.innerHTML='<div class="panel speakWrap"><div class="questionNo">UNIT '+sUnit+' • QUESTION '+(speakingIndex+1)+'/15</div><div class="bar"><i style="width:'+((speakingIndex+1)/15*100)+'%"></i></div><div class="image"><div class="pic">'+icon(q.image)+'</div><div class="label">[IMAGE: '+esc(q.image.toUpperCase())+']</div></div><div class="qtext">'+esc(q.question)+'</div><button class="speaker" onclick="replayQ()">🔊</button><div id="timer" class="timer"></div><div id="answer" class="answer hidden">'+t('answer')+': '+esc(q.answer)+'</div><div class="controls"><button class="control" onclick="backSpeak()" '+(speakingIndex===0?'disabled':'')+'>← Back</button><button class="control" onclick="replayQ()">🔊 Replay Question</button><button class="control" onclick="replayA()">🔊 Replay Answer</button><button id="next" class="control next" disabled onclick="nextSpeak()">⏭ Next</button><button class="control" onclick="speakUnits()">🏠 Back to Units</button></div></div>';delay=setTimeout(()=>startTimer(),Math.max(900,Math.min(3000,q.question.length*40)));speak(q.question,.72)}
function startTimer(){let n=4,e=document.getElementById('timer');if(!e)return;e.textContent=n;timer=setInterval(()=>{n--;if(n<=0){clearInterval(timer);timer=null;showAnswer()}else e.textContent=n},1000)}
function showAnswer(){sState='answer';let q=speakingData[sUnit][speakingIndex],a=document.getElementById('answer');a.classList.remove('hidden');a.textContent=t('answer')+': '+q.answer;document.getElementById('next').disabled=false;speak(q.answer,.72);delay=setTimeout(()=>nextSpeak(),Math.max(1200,q.answer.length*42))}
function replayQ(){speak(speakingData[sUnit][speakingIndex].question,.72)}function replayA(){if(sState==='answer')speak(speakingData[sUnit][speakingIndex].answer,.72)}function nextSpeak(){if(sState!=='answer')return;if(speakingIndex<14){speakingIndex++;showSpeak()}else finishSpeak()}function backSpeak(){if(speakingIndex>0){speakingIndex--;showSpeak()}}
function finishSpeak(){clearAll();main.innerHTML='<div class="panel finish"><h1>'+t('great')+'</h1><p>You finished Unit '+sUnit+'!</p><p>You completed 15 questions.</p><button class="primary" onclick="startSpeak('+sUnit+')">🔄 '+t('review')+'</button><button class="primary orange" onclick="speakUnits()">'+t('units')+'</button>'+(sUnit<16?'<button class="primary" onclick="startSpeak('+(sUnit+1)+')">'+t('nextUnit')+' →</button>':'')+'</div>'}
function clearAll(){if(timer){clearInterval(timer);timer=null}if(delay){clearTimeout(delay);delay=null}if('speechSynthesis'in window)speechSynthesis.cancel()}function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function speak(x,r=.75){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(x);u.lang='en-GB';u.rate=r;u.pitch=1;speechSynthesis.speak(u)}function beep(ok){try{let c=new AudioContext(),o=c.createOscillator(),g=c.createGain();o.frequency.value=ok?720:220;g.gain.value=.06;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.12)}catch(e){}}function icon(x){let k=x.toLowerCase().trim();if(IMG[k])return IMG[k];for(let z in IMG)if(k.includes(z))return IMG[z];return '🖼️'}function esc(x){return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function attr(x){return esc(x).replace(/`/g,'&#96;')}
